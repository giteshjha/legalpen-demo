<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LegalPen — the diary that keeps itself</title>
<style>
/* ============================================================
   LegalPen v3 — the register.
   Ink on paper-white, ruled lines instead of cards, one red
   used the way a registrar uses red ink. Two heroes: the date
   numeral rules time; the cause title rules the file.
   Desk layout ≥1100px: time spine | the day | the file.
   ============================================================ */
:root{
  --bg:#fcfbf7;
  --pane:#fefdfa;
  --ink:#1c1812;
  --ink2:#5b5347;
  --ink3:#8e8677;
  --rule:#e7e2d6;
  --rule2:#cfc7b6;
  --wash:#f4f0e6;
  --red:#b02e20;
  --redwash:#f9ebe8;
  --serif:'Iowan Old Style',Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
input,select,textarea{font:inherit;color:inherit;background:transparent}
a{color:inherit}
img{max-width:100%}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- typographic atoms ---------- */
.serif{font-family:var(--serif)}
.lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.lbl.dark{color:var(--ink2)}
.small{font-size:13px}.tiny{font-size:12px}
.mut{color:var(--ink2)}.faint{color:var(--ink3)}.red{color:var(--red)}
.rdot{color:var(--red);font-size:9px;vertical-align:2px}
.stamp{
  display:inline-block;border:1px solid var(--ink2);border-radius:2px;
  padding:1.5px 8px;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink2);white-space:nowrap;
}
.stamp.ink{border-color:var(--ink);color:var(--ink)}
.stamp.red{border-color:var(--red);color:var(--red)}
.stamp.fill{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.act{
  font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);
  border-bottom:1px solid var(--rule2);padding-bottom:1px;
}
.act:hover{border-bottom-color:var(--ink)}
.act.red{color:var(--red);border-bottom-color:transparent}
.btn-ink{
  display:block;width:100%;background:var(--ink);color:var(--bg);text-align:center;
  padding:12px;border-radius:3px;font-weight:600;letter-spacing:.02em;margin-top:16px;
}
.btn-ink:disabled{background:var(--rule2);cursor:default}
.btn-quiet{display:block;width:100%;text-align:center;color:var(--ink2);padding:10px;font-size:13.5px;margin-top:2px}
.rule-head{
  border-top:3px double var(--rule2);padding-top:8px;margin-top:30px;
  display:flex;align-items:baseline;gap:10px;
}
.rule-head:first-child{margin-top:0}
.rule-head .lbl{flex:1}
.rule-head .act{border-bottom-color:transparent}
.rule-head .act:hover{border-bottom-color:var(--ink)}

/* ---------- the desk ---------- */
#desk{display:block;min-height:100vh}
#spine{display:none}
#file{display:none}
#center{max-width:660px;margin:0 auto;padding:14px 18px 110px}
@media(min-width:1100px){
  #desk{display:grid;grid-template-columns:216px minmax(500px,1fr) minmax(520px,1.12fr);height:100vh;overflow:hidden}
  #spine{display:flex;flex-direction:column;border-right:1px solid var(--rule);overflow-y:auto;background:var(--bg)}
  #center{max-width:none;margin:0;overflow-y:auto;padding:26px 34px 60px;background:var(--pane)}
  #file{display:block;overflow-y:auto;border-left:1px solid var(--rule);padding:26px 34px 60px;background:var(--bg)}
  nav#phnav{display:none}
}
/* mid width: spine hidden, file as overlay (same as phone) */
@media(min-width:660px) and (max-width:1099px){
  #center{max-width:660px}
}

/* ---------- spine ---------- */
.sp-brand{padding:20px 18px 12px;font-family:var(--serif);font-size:21px}
.sp-brand b{color:var(--red);font-weight:700}
.sp-sub{padding:0 18px 14px;font-size:11px;color:var(--ink3);line-height:1.5}
.sp-sec{padding:12px 18px 4px}
.sday{
  display:flex;align-items:baseline;gap:9px;padding:4.5px 18px;width:100%;
  border-left:3px solid transparent;
}
.sday:hover{background:var(--wash)}
.sday.on{border-left-color:var(--ink);background:var(--wash)}
.sday.today .num{color:var(--red)}
.sday .num{font-family:var(--serif);font-size:17px;width:26px;text-align:right;flex-shrink:0}
.sday .dw{font-size:11px;color:var(--ink3);width:28px;flex-shrink:0}
.sday .marks{font-size:10px;letter-spacing:2px;color:var(--ink3)}
.sday .marks .r{color:var(--red)}
.sp-gap{height:7px;border-bottom:1px solid var(--rule);margin:0 18px 7px}
.sp-link{display:block;width:100%;padding:7px 18px;font-size:14px;border-left:3px solid transparent}
.sp-link:hover{background:var(--wash)}
.sp-link.on{border-left-color:var(--ink);background:var(--wash);font-weight:600}
.sp-link.sp-big{font-family:var(--serif);font-size:17px;font-weight:650;padding-top:9px}
.sp-link .cnt{color:var(--ink3);font-size:12px;margin-left:6px}
.sp-foot{margin-top:auto;padding:14px 18px 18px;font-size:11.5px;color:var(--ink3);line-height:1.7;border-top:1px solid var(--rule)}
.sp-foot button{color:var(--ink2);font-size:11.5px;border-bottom:1px solid var(--rule2)}
.pen-tog{display:flex;gap:0;margin:6px 0 10px;border:1px solid var(--rule2);border-radius:3px;overflow:hidden;width:max-content}
.pen-tog button{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;color:var(--ink3)}
.pen-tog button.on{background:var(--ink);color:var(--bg)}

/* ---------- phone nav ---------- */
nav#phnav{
  position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(252,251,247,.95);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom);
}
nav#phnav .in{max-width:660px;margin:0 auto;display:flex}
nav#phnav button{flex:1;text-align:center;padding:10px 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
nav#phnav button.on{color:var(--ink);font-weight:700}
nav#phnav button .d{display:block;font-family:var(--serif);font-size:17px;text-transform:none;letter-spacing:0}
nav#phnav button.on .d{color:var(--red)}

/* ---------- day register (center) ---------- */
.dayhead{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.dayhead .dn{font-family:var(--serif);font-size:56px;line-height:1;letter-spacing:-1px}
.dayhead .dmeta .dw{font-size:13px;letter-spacing:.22em;text-transform:uppercase}
.dayhead .dmeta .sub{color:var(--ink2);font-size:13.5px;margin-top:2px}
.dayhead.isred .dn{color:var(--red)}
.regrow{padding:13px 0;border-top:1px solid var(--rule);width:100%;display:block}
.regrow:hover{background:var(--wash)}
.regrow .t1{display:flex;align-items:baseline;gap:10px}
.regrow .cause{font-family:var(--serif);font-size:17px;font-weight:600}
.regrow .cno{margin-left:auto;font-size:12px;color:var(--ink3);white-space:nowrap;flex-shrink:0}
.regrow .l2{font-size:13.5px;color:var(--ink2);margin-top:2px}
.regrow .l2 b{color:var(--ink);font-weight:600}
.regrow .l3{font-size:13px;color:var(--ink2);margin-top:4px}
.regrow .stamps{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.courtline{display:flex;align-items:baseline;gap:8px;margin:16px 0 2px}
.courtline .c{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink)}
.courtline .trip{font-size:12px;color:var(--ink3)}
.duerow{padding:12px 0;border-top:1px solid var(--rule);width:100%;display:block}
.duerow:hover{background:var(--wash)}
.duerow .t1{display:flex;align-items:baseline;gap:10px}
.duerow .what{font-weight:600;font-size:15px}
.duerow .dleft{margin-left:auto;font-size:12.5px;color:var(--ink3);white-space:nowrap}
.duerow .dleft.hot{color:var(--red);font-weight:600}
.duerow .of{font-size:13px;color:var(--ink2);margin-top:1px}
.duerow .cost{font-size:13px;color:var(--ink2);margin-top:3px}
.duerow .prov{font-size:11.5px;color:var(--ink3);margin-top:3px}
.attn .duerow .what{color:var(--red)}
.strip{
  border:1px solid var(--rule2);border-left:3px solid var(--red);border-radius:3px;
  padding:11px 14px;margin-top:18px;display:flex;gap:12px;align-items:center;width:100%;
  background:var(--pane);
}
.strip .t{font-size:14px}
.strip .t b{font-weight:650}
.strip .go{margin-left:auto;white-space:nowrap}
.strip.ok{border-left-color:var(--ink3)}
.checkbox-line{font-size:13px;color:var(--ink2);margin-top:6px}
.datecheck input[type=date]{
  width:100%;border:0;border-bottom:1px solid var(--rule2);padding:8px 2px;font-size:16px;background:transparent;
}
.datecheck input[type=date]:focus{border-bottom-color:var(--ink)}
.clashline{margin-top:10px;font-size:13.5px;line-height:1.55;padding-left:12px;border-left:3px solid var(--rule2)}
.clashline.ok{border-left-color:#3d7a55;color:#33604a}
.clashline.warn{border-left-color:#a8720d;color:#7c5a14}
.clashline.bad{border-left-color:var(--red);color:var(--red)}
.causeline{font-size:12.5px;margin-top:6px;color:var(--ink2)}
.causeline .act{margin-left:12px}
.causeline.mis{color:var(--red)}

/* ---------- shelf / search ---------- */
.searchbar input{
  width:100%;border:0;border-bottom:1px solid var(--rule2);padding:9px 2px;font-size:16px;
}
.searchbar input:focus{border-bottom-color:var(--ink)}
.searchbar input::placeholder{color:var(--ink3)}
.shelf-tabs{display:flex;gap:14px;margin-top:14px;align-items:baseline}
.shelf-tabs button{font-size:13px;color:var(--ink3);padding-bottom:2px;border-bottom:2px solid transparent}
.shelf-tabs button.on{color:var(--ink);font-weight:650;border-bottom-color:var(--ink)}
.shelf-tabs .sp{flex:1}
.why{font-size:12px;color:var(--red);margin-top:3px}

/* ---------- file pane ---------- */
.file-empty{color:var(--ink3);text-align:center;padding-top:18vh;font-size:14px;line-height:2}
.file-empty .big{font-family:var(--serif);font-size:22px;color:var(--ink2)}
.fcover .kicker{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fcover h1{font-family:var(--serif);font-size:27px;font-weight:650;line-height:1.2;margin-top:6px}
.fcover .kind{color:var(--ink2);font-size:13.5px;margin-top:3px}
.fcover dl{margin-top:14px;display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;font-size:14px}
.fcover dt{color:var(--ink3);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.fcover dd b{font-weight:650}
.fcover dd .plink{border-bottom:1px solid var(--rule2)}
.fcover dd .plink:hover{border-bottom-color:var(--ink)}
.factions{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid var(--rule)}
.result-block{margin-top:14px;padding:12px 14px;border:1px solid var(--rule2);border-left:3px solid var(--red);border-radius:3px;font-size:13.5px;line-height:1.6}
.result-block.won{border-left-color:#3d7a55}
.ftabs{display:flex;gap:16px;margin-top:22px;border-bottom:1px solid var(--rule)}
.ftabs button{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);padding:0 0 7px;border-bottom:2px solid transparent;margin-bottom:-1px}
.ftabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.dentry{padding:13px 0;border-top:1px solid var(--rule)}
.dentry:first-child{border-top:none}
.dentry .dl1{display:flex;align-items:baseline;gap:10px}
.dentry .don{font-family:var(--serif);font-size:15.5px;font-weight:600;white-space:nowrap}
.dentry .purp{margin-left:auto;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);text-align:right}
.dentry .what{font-size:14px;margin-top:4px}
.dentry .what .det{color:var(--ink2)}
.dentry .sub{font-size:13px;color:var(--ink2);margin-top:3px}
.dentry .movednote{font-size:12.5px;color:var(--ink3);margin-top:3px;font-style:italic}
.dentry .dirline{font-size:13px;color:var(--ink2);margin-top:5px;display:flex;gap:8px;align-items:baseline}
.dentry .dirline .tickbtn{font-size:12px;border:1px solid var(--rule2);border-radius:2px;padding:0 6px;color:var(--ink2)}
.dentry .dirline .done{color:#3d7a55}
.dentry.blank .what{color:var(--red)}
.paper-row{padding:11px 0;border-top:1px solid var(--rule)}
.paper-row .pl{font-weight:600;font-size:14.5px}
.paper-row .pm{font-size:12.5px;color:var(--ink2);margin-top:2px}
.kindf{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 2px}
.kindf button{font-size:12px;color:var(--ink3);padding-bottom:1px;border-bottom:2px solid transparent}
.kindf button.on{color:var(--ink);font-weight:650;border-bottom-color:var(--ink)}
.story-row{display:flex;gap:14px;padding:8px 0;border-top:1px solid var(--rule);font-size:13.5px}
.story-row .sd{color:var(--ink3);white-space:nowrap;font-size:12.5px;width:72px;flex-shrink:0;font-variant-numeric:tabular-nums}
.fee-row{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--rule);font-size:14px;align-items:baseline}
.fee-row .amt{font-family:var(--serif);font-weight:650;width:96px}
.fee-total{margin-top:10px;padding-top:8px;border-top:3px double var(--rule2);font-size:14px;display:flex}
.fee-total b{margin-left:auto;font-family:var(--serif)}
.footnote{font-size:12px;color:var(--ink3);margin-top:12px;line-height:1.6}

/* ---------- forms & sheets ---------- */
.f-sec{margin-top:18px}
.f-sec .lbl{display:block;margin-bottom:8px}
.tin{
  width:100%;border:0;border-bottom:1px solid var(--rule2);padding:7px 2px;font-size:15.5px;background:transparent;
}
.tin:focus{border-bottom-color:var(--ink)}
.tin::placeholder{color:var(--ink3)}
.optrow{display:flex;gap:7px;flex-wrap:wrap}
.opt{
  border:1px solid var(--rule2);border-radius:2px;padding:4.5px 11px;font-size:13px;color:var(--ink2);background:var(--pane);
}
.opt.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:550}
.opt.more{border-style:dashed;color:var(--ink3)}
.fhint{font-size:12px;color:var(--ink3);margin-top:6px;line-height:1.55}
.fhint.red{color:var(--red)}
#sheetwrap{position:fixed;inset:0;z-index:60;display:none}
#sheetwrap.open{display:block}
#sheetwrap .shade{position:absolute;inset:0;background:rgba(28,24,18,.45)}
#sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;
  background:var(--bg);border-radius:10px 10px 0 0;padding:24px 22px calc(28px + env(safe-area-inset-bottom));
  border-top:3px double var(--rule2);
}
@media(min-width:760px){
  #sheet{left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%);
    width:560px;border-radius:6px;max-height:84%;border:1px solid var(--rule2)}
}
#sheet h2{font-family:var(--serif);font-size:21px;font-weight:650}
#sheet .sub{color:var(--ink2);font-size:13.5px;margin-top:4px}
#toast{
  position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);font-size:13.5px;padding:9px 18px;border-radius:3px;
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:80;white-space:nowrap;max-width:92vw;
}
#toast.show{opacity:1}
@media(min-width:1100px){#toast{bottom:34px}}

/* close flow */
.close-id{padding-bottom:6px}
.close-id .t{font-family:var(--serif);font-size:20px;font-weight:650}
.close-id .m{color:var(--ink2);font-size:13.5px;margin-top:3px}
.prog{font-size:12px;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}
.done-hero{text-align:center;padding:60px 10px 8px}
.done-hero .dn{font-family:var(--serif);font-size:46px;color:var(--red)}
.done-hero .big{font-family:var(--serif);font-size:23px;font-weight:650;margin-top:8px}
.done-hero .sub{color:var(--ink2);margin-top:10px;font-size:14.5px;line-height:1.6}

/* bundle */
.b-row{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-top:1px solid var(--rule);width:100%}
.b-row .ord{width:26px;height:26px;border:1px solid var(--rule2);border-radius:50%;text-align:center;line-height:24px;font-size:13px;flex-shrink:0;font-family:var(--serif)}
.b-row.sel .ord{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.b-index{margin-top:14px;border:1px solid var(--rule2)}
.b-index table{width:100%;border-collapse:collapse;font-size:13px}
.b-index th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:7px 10px;border-bottom:1px solid var(--rule2);background:var(--wash)}
.b-index td{padding:7px 10px;border-bottom:1px solid var(--rule)}
.b-index td.num,.b-index th.num{text-align:right;font-variant-numeric:tabular-nums}

/* party */
.pt-head h1{font-family:var(--serif);font-size:24px;font-weight:650}
.pt-head .sub{color:var(--ink2);font-size:13.5px;margin-top:4px}
.stand{margin-top:12px;padding:10px 14px;border-left:3px solid var(--rule2);font-size:13.5px;color:var(--ink2)}

/* phone file overlay */
@media(max-width:1099px){
  #file.open{
    display:block;position:fixed;inset:0;z-index:50;background:var(--bg);
    overflow-y:auto;padding:16px 18px 80px;
  }
}
.file-back{display:none;margin-bottom:10px}
@media(max-width:1099px){.file-back{display:block}}
footer{max-width:660px;margin:0 auto;padding:10px 18px 26px;color:var(--ink3);font-size:11.5px;line-height:1.7}
@media(min-width:1100px){footer{display:none}}
footer button{color:var(--ink2);font-size:11.5px;border-bottom:1px solid var(--rule2)}
</style>
</head>
<body>
<div id="desk">
  <aside id="spine"></aside>
  <main id="center"></main>
  <section id="file"></section>
</div>
<footer id="foot"></footer>
<nav id="phnav"><div class="in" id="phnav-in"></div></nav>
<div id="sheetwrap"><div class="shade" data-act="sheet-close"></div><div id="sheet"></div></div>
<div id="toast"></div>
<script>
'use strict';
/* ============================================================
   Fixed demo clock: Wednesday 19 August 2026. Every date below
   is hand-checked — weekdays, forum-correct windows, holidays.
   Nothing persists: refresh and the demo is pristine.
   ============================================================ */
const TODAY='2026-08-19';
const MS=86400000;
const DW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DWS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const HOLIDAYS={'2026-01-26':'Republic Day','2026-08-15':'Independence Day','2026-10-02':'Gandhi Jayanti'};
function fromISO(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function dow(s){return fromISO(s).getDay();}
function dnum(s){return fromISO(s).getDate();}
function addDays(s,n){const d=fromISO(s);d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function daysUntil(s){return Math.round((fromISO(s)-fromISO(TODAY))/MS);}
function fmt(s){const d=fromISO(s);return DWS[d.getDay()]+' '+d.getDate()+' '+MO[d.getMonth()];}
function fmtY(s){const d=fromISO(s);return fmt(s)+(d.getFullYear()===2026?'':' '+d.getFullYear());}
function fmtDot(s){const[y,m,d]=s.split('-');return d+'.'+m+'.'+y;}
function fmtLong(s){const d=fromISO(s);return DW[d.getDay()]+' '+d.getDate()+' '+MO[d.getMonth()]+' '+d.getFullYear();}
function closedWhy(s){if(dow(s)===0)return'Sunday — courts closed';if(HOLIDAYS[s])return HOLIDAYS[s]+' — courts closed';return null;}
function rollS4(s){let x=s,i=0,rolled=false;while(closedWhy(x)&&i++<10){x=addDays(x,1);rolled=true;}return{date:x,rolled};}
function rel(s){const n=daysUntil(s);
  if(n===0)return'today';if(n===1)return'tomorrow';if(n===-1)return'yesterday';
  return n>0?('in '+n+' days'):(Math.abs(n)+' days ago');}
function inr(n){return'₹'+Number(n).toLocaleString('en-IN');}

/* ============================================================
   DERIVATIONS — every surface is a query over the records.
   A matter has ONE current listing: its earliest hearing without
   an outcome, or the next date given at the last closed hearing.
   The appeal clock reads the certified-copy PAPERS — the same
   record, never a second store.
   ============================================================ */
function cName(m){return m.client&&m.client.length?P(m.client[0]).name:(m.clientName||'—');}
function oName(m){return m.opp&&m.opp.length?P(m.opp[0]).name:(m.oppName||'—');}
function open_(){return MATTERS.filter(m=>!m.archived);}
function closedHearings(m){return (m.hearings||[]).filter(h=>h.outcome).sort((a,b)=>a.on<b.on?-1:1);}
function lastClosed(m){const c=closedHearings(m);return c.length?c[c.length-1]:null;}
function currentListing(m){
  if(m.outcome)return null;
  const openH=(m.hearings||[]).filter(h=>!h.outcome).sort((a,b)=>a.on<b.on?-1:1)[0];
  if(openH)return{on:openH.on,purpose:openH.purpose,presence:openH.presence,room:openH.room,item:openH.item,h:openH,unrecorded:openH.on<=TODAY};
  const lc=lastClosed(m);
  if(lc&&lc.next)return{on:lc.next.on,purpose:lc.next.purpose,presence:lc.next.presence,virtual:true};
  return null;
}
function listingsOn(date,exceptId){
  const out=[];
  for(const m of open_()){
    if(m.id===exceptId)continue;
    for(const h of closedHearings(m))if(h.on===date)out.push({m,h,on:date,purpose:h.purpose,room:h.room,item:h.item,presence:h.presence,outcome:h.outcome,next:h.next});
    const cur=currentListing(m);
    if(cur&&cur.on===date&&!out.some(x=>x.m===m))out.push({m,...cur});
  }
  return out;
}
function unrecorded(){
  const out=[];
  for(const m of open_())for(const h of m.hearings||[])
    if(!h.outcome&&h.on<=TODAY)out.push({m,h});
  return out.sort((a,b)=>a.h.on<b.h.on?-1:1);
}
function daysBetweenIncl(a,b){return Math.round((fromISO(b)-fromISO(a))/MS)+1;}
function copyTime(m){
  const o=m.outcome;if(!o)return null;
  const ap=(m.papers||[]).filter(p=>p.kind==='Copy application'&&p.dt>=o.judgmentOn).sort((a,b)=>a.dt<b.dt?-1:1)[0];
  const rc=(m.papers||[]).filter(p=>p.kind==='Certified copy'&&p.dt>=o.judgmentOn).sort((a,b)=>a.dt<b.dt?-1:1)[0];
  if(ap&&rc&&rc.dt>=ap.dt)return{applied:ap.dt,received:rc.dt,days:daysBetweenIncl(ap.dt,rc.dt)};
  if(ap&&!rc)return{applied:ap.dt,received:null,days:0,pending:true};
  return null;
}
function appealLastDay(m){
  const o=m.outcome;if(!o||!o.appeal)return null;
  const ct=copyTime(m);
  const excl=ct&&!ct.pending?ct.days:0;
  const raw=addDays(addDays(o.judgmentOn,o.appeal.windowDays),excl);
  const r=rollS4(raw);
  return{last:r.date,excl,rolled:r.rolled,ct};
}
function dueList(){
  const out=[];
  for(const m of MATTERS){
    if(m.archived)continue;
    for(const h of m.hearings||[])for(const d of h.directions||[])
      out.push({kind:'dir',m,h,d,due:d.by,title:d.what,who:d.who,done:d.done,
        prov:'Born at the hearing of '+fmt(h.on)+' — never entered twice.',
        cost:d.cost||(d.who==='them'?'their obligation — watch it':d.who==='client'?'the client must act — call ahead':'miss = explaining the delay to the court')});
    if(m.refile&&!m.refile.done)out.push({kind:'refile',m,due:m.refile.by,title:m.refile.what,who:'us',
      prov:'Born from the '+m.refile.born+'.',cost:'miss = refiling may count as fresh — limitation trouble'});
    if(m.limitation&&m.limitation.state==='stated'&&!m.limitation.met)
      out.push({kind:'limit',m,due:m.limitation.by,title:m.limitation.label,who:'us',
        prov:m.limitation.basis,cost:'miss = the claim becomes time-barred'});
    if(m.outcome&&m.outcome.appeal){
      const a=m.outcome.appeal,ap=appealLastDay(m);
      if(ap&&(a.decision==='undecided'||a.decision==='dropped')&&ap.last>=TODAY)
        out.push({kind:'appeal',m,due:ap.last,title:'Last day to appeal — '+a.forum,who:'us',
          prov:a.basis+', from the judgment of '+fmtDot(m.outcome.judgmentOn)
            +(ap.excl?'; '+ap.excl+' days of certified-copy time excluded (s.12(2))':'; no certified-copy time on the papers yet')
            +(ap.rolled?'; last day rolled forward past a holiday (s.4)':'')+'. Verify the working before filing.',
          cost:'miss = the appeal becomes time-barred',
          pill:a.decision==='dropped'?'not appealing — watched till expiry':'client undecided'});
    }
    for(const pr of m.protections||[]){
      if(pr.vacated)continue;
      const cur=currentListing(m);
      if(pr.mode==='till-next-date'&&cur)
        out.push({kind:'prot',m,due:cur.on,title:pr.label+' — operates till this date',who:'us',
          prov:'Carried on the '+pr.born+'.',cost:'miss = the protection lapses with the date'});
      if(pr.mode==='condition'&&pr.condition&&!pr.condition.met)
        out.push({kind:'cond',m,due:pr.condition.by,title:pr.condition.what,who:pr.condition.who||'client',
          prov:'The condition on the '+pr.born+' — the stay lives or dies by it.',
          cost:'miss = '+pr.label.toLowerCase()+' dissolves'});
    }
  }
  return out.sort((a,b)=>a.due<b.due?-1:1);
}
function overdue(){return dueList().filter(i=>i.due<TODAY&&!i.done);}
function exposedStays(){

function limitationUnknowns(){return open_().filter(m=>m.limitation&&m.limitation.state==='unknown');}
function callList(){
  const out=[];
  for(const m of open_())for(const h of closedHearings(m))if(h.on===TODAY){
    const p=m.client&&m.client.length?P(m.client[0]):null;

      line:h.outcome.label+(h.outcome.detail?' — '+h.outcome.detail:'')+(h.next?' · next '+fmt(h.next.on):'')});

function clashCheck(dateISO,exceptId){
  const why=closedWhy(dateISO);
  if(why)return{level:'bad',msg:fmt(dateISO)+': '+why+'.'};
  const ls=listingsOn(dateISO,exceptId).filter(l=>!l.outcome);
  const satNote=dow(dateISO)===6?' It is a Saturday — confirm the bench sits.':'';
  if(!ls.length)return{level:'ok',msg:'Nothing else listed '+fmt(dateISO)+' — clear across your files.'+satNote};
  const cx=[...new Set(ls.map(l=>l.m.complex))];
  const names=ls.map(l=>l.m.caseNo+' ('+l.m.complex+')').join(' · ');
  if(cx.length===1)return{level:'ok',msg:ls.length+' already listed '+fmt(dateISO)+' — '+names+'. Same complex — one trip.'+satNote};
  if(cx.length>=3||ls.length>=4)return{level:'bad',msg:ls.length+' already listed '+fmt(dateISO)+' across '+cx.length+' complexes — '+names+'. A split morning; ask for another date while you still can.'+satNote};
  return{level:'warn',msg:ls.length+' already listed '+fmt(dateISO)+' — '+names+'. Two complexes on one morning — take it only if you must.'+satNote};
}
function searchMatters(q){
  q=q.trim().toLowerCase();if(!q)return null;
  const hits=[];
  for(const m of MATTERS){
    let why=null;
    if(m.title.toLowerCase().includes(q))why='title';
    else if((m.caseNo||'').toLowerCase().includes(q))why='case number';
    else{
      const c=cName(m),o=oName(m);
      if(c.toLowerCase().includes(q))why='client: '+c;
      else if(o.toLowerCase().includes(q))why='opposing party: '+o;
      else if((m.court||'').toLowerCase().includes(q))why='court: '+m.court;
      else if((m.kind||'').toLowerCase().includes(q))why='matter type: '+m.kind;
      else{
        const p=(m.papers||[]).find(x=>x.label.toLowerCase().includes(q));
        if(p)why='paper: “'+p.label+'”';
        else if(m.outcome&&m.outcome.label.toLowerCase().includes(q))why='result: '+m.outcome.label;
        else if((m.filedOn||'').startsWith(q))why='filing year';
      }
    }
    if(why)hits.push({m,why});
  }
  return hits;
}
function partyMatters(pid){
  const asC=[],asO=[];
  for(const m of MATTERS){
    if((m.client||[]).includes(pid))asC.push(m);
    if((m.opp||[]).includes(pid))asO.push(m);
  }
  return{asC,asO};
}
function conflictHits(typed){
  const q=(typed||'').trim().toLowerCase();
  if(q.length<4)return[];
  const out=[];
  for(const[pid,p]of Object.entries(PARTIES)){
    if(p.name.toLowerCase().includes(q)){
      const{asC,asO}=partyMatters(pid);
      if(asC.length||asO.length)out.push({pid,p,asC,asO});
    }
  }
  return out;
}
function storyOf(m){
  const rows=[];
  if(m.consultedOn)rows.push({on:m.consultedOn,t:'File opened — consultation.'});
  if(m.filedOn)rows.push({on:m.filedOn,t:'Filed — '+(m.court||'')+'.'});
  const hearingDates=new Set(closedHearings(m).map(h=>h.on));
  for(const h of closedHearings(m)){
    const orderSameDay=(m.papers||[]).some(p=>p.kind==='Order'&&p.dt===h.on);
    rows.push({on:h.on,t:h.outcome.label+(h.outcome.detail?' — '+h.outcome.detail:'')+(orderSameDay?' (order on file)':'')+'.'});
    if(h.moved)rows.push({on:h.moved.on,t:'Listing of '+fmt(h.moved.from)+' moved to '+fmt(h.on)+' by the court — '+h.moved.why+'.'});
  }
  for(const h of (m.hearings||[]).filter(h=>!h.outcome&&h.moved))
    rows.push({on:h.moved.on,t:'Listing of '+fmt(h.moved.from)+' moved to '+fmt(h.on)+' by the court — '+h.moved.why+'.'});
  for(const p of m.papers||[]){
    if(hearingDates.has(p.dt))continue;
    rows.push({on:p.dt,t:p.label+' — on file.'});
  }
  for(const f of m.fees||[])rows.push({on:f.on,t:inr(f.amt)+' received'+(f.note?' — '+f.note:'')+'.'});
  if(m.outcome)rows.push({on:m.outcome.judgmentOn,t:'Result: '+m.outcome.label+'.'});
  return rows.sort((a,b)=>a.on<b.on?1:-1);
}

  let c={t:'day',date:TODAY};
  switch(p[0]){
    case'd':c={t:'day',date:p[1]||TODAY};break;
    case'w':c={t:'week'};break;

function dueRow(i,opts){

function groupedListings(date,opts){
  const ls=listingsOn(date);
  if(!ls.length)return'';
  const g=new Map();
  for(const l of ls){const k=l.m.complex||'—';if(!g.has(k))g.set(k,[]);g.get(k).push(l);}
  let h='';
  for(const[cx,arr]of g){
    h+='<div class="courtline"><span class="c">'+esc(cx)+'</span>'+(arr.length>1?'<span class="trip">'+arr.length+' matters — one trip</span>':'')+'</div>'
     +arr.map(l=>listingRow(l,opts)).join('');
  }
  return h;
}
function vDay(date){

       +od.map(i=>dueRow(i)).join('')

          +'<div class="cost">'+esc(m.limitation.basis)+'</div></button>').join('')
       +ex.map(x=>'<button class="duerow" data-act="open-m" data-id="'+x.m.id+'">'
          +'<div class="t1"><span class="what"><span class="rdot">●</span> '+esc(x.pr.label)+' has no next date on record</span><span class="dleft hot">exposed</span></div>'
          +'<div class="of">'+esc(x.m.title)+' — a till-next-date protection with no date to ride on</div></button>').join('')
       +'</div><div class="footnote">A missed date stays here until it is dealt with — it does not slip out of sight.</div>';
    }
    const horizon=dueList().filter(i=>i.due>TODAY&&!i.done).slice(0,5);
    if(horizon.length)h+='<div class="rule-head"><span class="lbl">On the horizon</span><button class="act" data-act="week">week board</button></div>'
      +horizon.map(i=>dueRow(i)).join('');

        +'<span class="dleft">'+(c.phone?'<a href="tel:+91'+c.phone.replace(/\s/g,'')+'" style="color:var(--ink)">'+c.phone+'</a>':'no phone on record')+'</span></div>'

        +'<button class="act" data-act="open-m" data-id="'+c.m.id+'">open file</button></div></div>').join('');
  }
  if(!ls.length&&!dues.length&&!isToday)h+='<div class="footnote" style="margin-top:26px">'+(hol?hol+'.':'Nothing listed, nothing due.')+'</div>';
  return h;

function vWeek(){
  const days=['2026-08-17','2026-08-18','2026-08-19','2026-08-20','2026-08-21','2026-08-22'];

function shelfLine(m){
  if(m.outcome){
    const a=m.outcome.appeal,ap=a?appealLastDay(m):null;
    return'<div class="l2"><span class="stamp'+(m.outcome.result==='lost'?' red':'')+'">'+esc(m.outcome.result)+'</span> '
      +esc(m.outcome.label)+' · '+fmtY(m.outcome.judgmentOn)
      +(ap&&(a.decision==='undecided')&&ap.last>=TODAY?' — <span class="red">appeal window till '+fmt(ap.last)+'</span>':'')+'</div>';
  }
  const cur=currentListing(m);
  if(cur){
    if(cur.unrecorded)return'<div class="l2 red">Listed '+(cur.on===TODAY?'today':fmt(cur.on))+' — not recorded yet</div>';
    return'<div class="l2">NEXT <b>'+fmt(cur.on)+'</b> · '+esc(cur.purpose||'')+'</div>';
  }
  if(m.refile)return'<div class="l2"><b class="red">'+esc(m.refile.what)+'</b> by <b>'+fmt(m.refile.by)+'</b></div>';
  if(m.limitation&&m.limitation.state==='unknown')return'<div class="l2 red">Limitation not worked out yet</div>';
  if(m.limitation&&m.limitation.state==='stated'&&!m.limitation.met)return'<div class="l2">'+esc(m.limitation.label)+' by <b>'+fmt(m.limitation.by)+'</b></div>';

   +'<div class="t1"><span class="cause">'+esc(m.title)+'</span><span class="cno">'+esc(m.caseNo||'consultation')+'</span></div>'
   +'<div class="l2 mut">'+esc(m.court||m.kind)+' · for '+esc(cName(m))+'</div>'

function sortKey(m){
  const c=currentListing(m);if(c)return c.on;
  if(m.refile)return m.refile.by;
  if(m.outcome&&m.outcome.appeal&&m.outcome.appeal.decision==='undecided'){const ap=appealLastDay(m);if(ap)return ap.last;}
  if(m.limitation&&m.limitation.state==='stated')return m.limitation.by;
  if(m.limitation&&m.limitation.state==='unknown')return'0000';
  return'9999';
}

  const id='um'+(MSEQ++);

    ?{state:'stated',label:'Limitation — last date as stated at intake',by:N.limDate,basis:'Stated by counsel at intake, '+fmtDot(TODAY)+'. The app tracks it; it does not compute it.'}
    :{state:'unknown',label:'Limitation not worked out yet',basis:'Flagged at intake on '+fmtDot(TODAY)+' — state the date before filing.'};
  MATTERS.unshift({id,title:N.client.trim()+' v. '+N.opp.trim(),caseNo:null,cnr:null,
    kind:N.kind,court:null,complex:null,client:[cid],opp:[oid],filedOn:null,consultedOn:TODAY,
    side:'pre-filing',facts:(N.facts||'').trim()||null,limitation:lim,hearings:[],papers:[]});
  N.client='';N.opp='';N.lim=null;N.limDate='';N.facts='';
  toast('File opened — cover first, case number when it is filed');
  setRoute({t:'shelf'},{t:'m',id});
}

/* ============================================================
   FILE PANE — the matter, or a party

function fileHTML(){
  if(!S.file)return'<div class="file-empty"><div class="big">Pick up a file</div>Tap any matter, any party, anywhere.<br>It opens here, beside the day.</div>';
  if(S.file.t==='p')return partyHTML(S.file.id);
  const m=byId(S.file.id);
  if(!m)return'<div class="file-empty"><div class="big">File not found</div></div>';
  return matterHTML(m);
}
function matterHTML(m){
  const tab=S.ftab[m.id]||'diary';
  const cur=currentListing(m);
  let h='<div class="file-back"><button class="act" data-act="file-close">‹ Put the file down</button></div>';
  h+='<div class="fcover"><div class="kicker">'
   +(m.archived?'<span class="stamp">archived</span>':'')
   +(m.outcome?'<span class="stamp'+(m.outcome.result==='lost'?' red':' ink')+'">'+esc(m.outcome.result)+'</span>':'')
   +(!m.filedOn&&!m.outcome?'<span class="stamp">pre-filing</span>':'')
   +(cur&&cur.unrecorded?'<span class="stamp red">to record</span>':'')
   +'</div><h1>'+esc(m.title)+'</h1>'
   +'<div class="kind">'+esc(m.kind)+(m.side?' · '+esc(m.side):'')+'</div><dl>';
  h+='<dt>Parties</dt><dd>'+partyLinks(m)+'</dd>';
  if(m.facts)h+='<dt>Facts</dt><dd>'+esc(m.facts)+'</dd>';
  if(m.caseNo)h+='<dt>Case no.</dt><dd><b>'+esc(m.caseNo)+'</b>'+(m.cnr?' · CNR '+esc(m.cnr):'')+'</dd>';
  if(m.court)h+='<dt>Court</dt><dd>'+esc(m.court)+'</dd>';
  h+='<dt>'+(m.filedOn?'Filed':'Consulted')+'</dt><dd>'+fmtY(m.filedOn||m.consultedOn)+'</dd>';
  if(cur&&!m.outcome)h+='<dt>Next date</dt><dd><b>'+fmt(cur.on)+'</b> · '+esc(cur.purpose||'')+' <span class="faint">('+rel(cur.on)+')</span></dd>';
  h+='</dl>';
  if(m.note)h+='<div class="fhint" style="margin-top:8px">'+esc(m.note)+'</div>';
  if(m.outcome)h+=resultBlock(m);
  h+='<div class="factions">'
   +'<button class="act" data-act="copymsg" data-id="'+m.id+'">Copy as message</button>'
   +(!m.outcome?'<button class="act" data-act="sh-hearing" data-id="'+m.id+'">Record a hearing</button>':'')
   +'<button class="act" data-act="sh-paper" data-id="'+m.id+'">Add a paper</button>'
   +(!m.outcome&&m.filedOn?'<button class="act" data-act="sh-outcome" data-id="'+m.id+'">How it ended</button>':'')
   +'<button class="act" data-act="sh-cover" data-id="'+m.id+'">'+(m.filedOn?'Edit cover':'File it / edit cover')+'</button>'
   +((m.papers||[]).length>1?'<button class="act" data-act="sh-bundle" data-id="'+m.id+'">Bundle</button>':'')
   +(m.outcome&&!m.archived?'<button class="act" data-act="archive" data-id="'+m.id+'">Put away</button>':'')
   +'</div></div>';
  h+='<div class="ftabs">'+['diary','dates','papers','story','fees'].map(t=>
    '<button data-act="ftab" data-id="'+m.id+'" data-v="'+t+'" class="'+(tab===t?'on':'')+'">'+t+'</button>').join('')+'</div>';
  h+={diary:fDiary,dates:fDates,papers:fPapers,story:fStory,fees:fFees}[tab](m);
  return h;
}
function partyLinks(m){
  const roles=roleFor(m);
  const links=(side,role)=>{
    const ids=side==='client'?(m.client||[]):(m.opp||[]);
    const tag=role?' <span class="faint tiny">('+role+')</span>':'';
    if(ids.length)return ids.map(pid=>'<button class="plink" data-act="open-p" data-id="'+pid+'">'+esc(P(pid).name)+'</button>').join(', ')+tag;
    return esc(side==='client'?(m.clientName||'—'):(m.oppName||'—'))+tag;
  };
  return links('client',roles&&roles[0])+' <span class="faint">vs</span> '+links('opp',roles&&roles[1]);
}
function resultBlock(m){
  const o=m.outcome,a=o.appeal,ap=a?appealLastDay(m):null;
  let h='<div class="result-block'+(o.result==='won'?' won':'')+'"><b>'+esc(o.label)+'</b> — judgment of '+fmt(o.judgmentOn)+', recorded '+fmt(o.recordedOn)+'.';
  if(a&&ap){
    if(a.decision==='undecided'&&ap.last>=TODAY){
      h+='<br>Appeal to the <b>'+esc(a.forum)+'</b> possible till <b>'+fmt(ap.last)+'</b> ('+daysUntil(ap.last)+' days). Client undecided — the clock runs regardless.'
       +(ap.ct&&ap.ct.pending?'<br><span class="red">Certified copy applied '+fmtDot(ap.ct.applied)+', not yet received — the window will extend when the copy paper is added.</span>':'')
       +'<div style="margin-top:8px;display:flex;gap:14px"><button class="act" data-act="sh-appealfiled" data-id="'+m.id+'">Appeal filed</button>'
       +'<button class="act" data-act="appeal-drop" data-id="'+m.id+'">Not appealing</button></div>';
    }else if(a.decision==='dropped'&&ap.last>=TODAY){
      h+='<br><span class="stamp">not appealing</span> decided — but the window stays watched till <b>'+fmt(ap.last)+'</b>, because clients change their minds.'
       +'<div style="margin-top:8px"><button class="act" data-act="appeal-undecide" data-id="'+m.id+'">Client reconsidered</button></div>';
    }else if(a.decision==='filed'){
      h+='<br>Appeal filed '+fmt(a.filedOn)+' — the clock is answered.';
    }else if(ap.last<TODAY){
      h+='<br>Appeal window closed '+fmt(ap.last)+'.';
    }
  }
  return h+'</div>';
}
function fDiary(m){
  const hs=[...(m.hearings||[])].sort((a,b)=>a.on<b.on?1:-1);
  let h='<div class="f-sec" style="margin-top:14px">';
  const un=unrecorded().filter(u=>u.m.id===m.id);
  if(un.length)h+='<button class="strip" style="margin-top:0" data-act="close-start" data-mid="'+m.id+'"><span class="t"><b>Today’s hearing is not recorded.</b></span><span class="go act red">Record it →</span></button>';
  if(!hs.length){h+='<div class="footnote">No hearings yet — '+(m.filedOn?'awaiting first listing. Record one from the actions above.':'not filed yet.')+'</div></div>';return h;}
  let newestClosed=true;
  h+='<div style="margin-top:4px">';
  for(const hr of hs){
    if(!hr.outcome){
      if(hr.on>TODAY){
        h+='<div class="dentry"><div class="dl1"><span class="don">'+fmt(hr.on)+'</span><span class="purp">'+esc(hr.purpose||'')+'</span></div>'
         +'<div class="sub">Listed — coming up ('+rel(hr.on)+').'+(hr.presence?' '+esc(hr.presence.name)+' to appear.':'')+'</div>'
         +(hr.moved?'<div class="movednote">Moved by the court from '+fmt(hr.moved.from)+' — '+esc(hr.moved.why)+'.</div>':'')
         +'<div style="margin-top:6px"><button class="act" data-act="sh-move" data-id="'+m.id+'" data-v="'+hr.on+'">Court moved the date</button></div></div>';
      }else{
        h+='<div class="dentry blank"><div class="dl1"><span class="don">'+fmt(hr.on)+'</span><span class="purp">'+esc(hr.purpose||'')+'</span></div>'
         +'<div class="what">No outcome recorded — the diary has a blank line.</div></div>';
      }
      continue;
    }
    let e='<div class="dentry"><div class="dl1"><span class="don">'+fmtY(hr.on)+'</span><span class="purp">'+esc(hr.purpose||'')+'</span></div>';
    e+='<div class="what">'+esc(hr.outcome.label)+(hr.outcome.detail?' <span class="det">— '+esc(hr.outcome.detail)+'</span>':'')
     +(hr.by==='munshi'?' <span class="faint tiny">· munshi’s entry</span>':'')+'</div>';
    if(hr.moved)e+='<div class="movednote">This listing was moved by the court from '+fmt(hr.moved.from)+' — '+esc(hr.moved.why)+'.</div>';
    if(hr.next&&newestClosed)e+='<div class="sub">→ next <b>'+fmt(hr.next.on)+'</b> · '+esc(hr.next.purpose||'')+(hr.next.presence?' · '+esc(hr.next.presence.name)+' to appear':'')+'</div>';
    for(const d of hr.directions||[]){
      e+='<div class="dirline">'+(d.done?'<span class="done">✓</span>':'<button class="tickbtn" data-act="dir-done" data-id="'+m.id+'" data-v="'+esc(hr.on+'|'+d.what)+'">mark done</button>')
       +'<span>'+esc(d.what)+' — '+(d.who==='us'?'we act':d.who==='them'?'they act':'client acts')+' by '+fmt(d.by)
       +(d.done?' <span class="done">done '+fmtDot(d.done)+'</span>':'')+'</span></div>';
    }
    e+='</div>';h+=e;newestClosed=false;
  }
  h+='</div><div class="footnote">Each entry was written once, at the hearing. The boards, the dates page and the story are built from these lines.</div></div>';
  return h;
}
function fDates(m){
  let rows='';
  if(m.limitation&&m.limitation.state==='stated'){
    for(const c of m.limitation.chain||[])
      rows+='<div class="duerow" style="cursor:default"><div class="t1"><span class="what" style="color:#3d7a55">✓ '+esc(c.label)+'</span><span class="dleft">done '+fmtDot(c.met)+'</span></div><div class="prov">Was due by '+fmt(c.by)+' — met in time.</div></div>';
    if(m.limitation.met)
      rows+='<div class="duerow" style="cursor:default"><div class="t1"><span class="what" style="color:#3d7a55">✓ '+esc(m.limitation.label)+'</span><span class="dleft">done '+fmtDot(m.limitation.met)+'</span></div></div>';
    else rows+='<div class="duerow" style="cursor:default"><div class="t1"><span class="what">'+esc(m.limitation.label)+'</span><span class="dleft'+(daysUntil(m.limitation.by)<=5?' hot':'')+'">'+rel(m.limitation.by)+'</span></div>'
      +'<div class="of">by <b>'+fmt(m.limitation.by)+'</b></div>'
      +'<div class="cost">miss = the claim becomes time-barred</div><div class="prov">'+esc(m.limitation.basis)+'</div>'
      +'<div style="margin-top:7px"><button class="act" data-act="limit-met" data-id="'+m.id+'">Mark met</button></div></div>';
  }
  if(m.limitation&&m.limitation.state==='unknown')
    rows+='<div class="duerow" style="cursor:default"><div class="t1"><span class="what red">'+esc(m.limitation.label)+'</span><span class="dleft hot">no date yet</span></div>'
     +'<div class="cost">'+esc(m.limitation.basis)+'</div><div class="prov">This stays red until you state the date — the app never invents one.</div>'
     +'<div style="margin-top:7px"><button class="act" data-act="sh-limit" data-id="'+m.id+'">State the date</button></div></div>';
  for(const i of dueList().filter(i=>i.m.id===m.id&&['dir','refile','prot','cond','appeal'].includes(i.kind))){
    const missed=i.due<TODAY&&!i.done;
    rows+='<div class="duerow" style="cursor:default"><div class="t1"><span class="what">'+(missed?'<span class="rdot">●</span> ':'')+esc(i.title)+'</span>'
     +'<span class="dleft'+(missed||daysUntil(i.due)<=2?' hot':'')+'">'+(missed?Math.abs(daysUntil(i.due))+' days over':rel(i.due))+'</span></div>'
     +'<div class="of">by <b>'+fmt(i.due)+'</b>'+(i.who==='them'?' · their obligation':i.who==='client'?' · <span class="red">client must act</span>':'')
     +(i.pill?' · <span class="stamp">'+esc(i.pill)+'</span>':'')+'</div>'
     +'<div class="cost">'+esc(i.cost)+'</div><div class="prov">'+esc(i.prov)+'</div>'
     +(i.kind==='dir'&&!i.done?'<div style="margin-top:7px"><button class="act" data-act="dir-done" data-id="'+m.id+'" data-v="'+esc(i.h.on+'|'+i.d.what)+'">Mark done</button></div>':'')
     +(i.kind==='refile'?'<div style="margin-top:7px"><button class="act" data-act="refile-done" data-id="'+m.id+'">Refiled — done</button></div>':'')
     +(i.kind==='cond'?'<div style="margin-top:7px"><button class="act" data-act="cond-met" data-id="'+m.id+'">Condition met</button></div>':'')
     +'</div>';
  }
  const cur=currentListing(m);
  if(cur&&!cur.unrecorded)rows+='<div class="duerow" style="cursor:default"><div class="t1"><span class="what">Next hearing — '+esc(cur.purpose||'')+'</span><span class="dleft">'+rel(cur.on)+'</span></div>'
   +'<div class="of"><b>'+fmt(cur.on)+'</b>'+(cur.presence?' · '+esc(cur.presence.name)+' to appear':'')+'</div>'
   +'<div class="prov">Born at the last hearing — never entered twice.</div></div>';
  if(!rows)rows='<div class="footnote" style="margin-top:14px">Nothing on the clock for this file.</div>';
  return'<div class="f-sec" style="margin-top:6px">'+rows
   +'<div class="footnote">This page collects — it never asks. Every date above was born inside a hearing, a paper, a result or the cover page.</div></div>';
}
function fPapers(m){
  const ps=[...(m.papers||[])].sort((a,b)=>a.dt<b.dt?1:-1);
  let h='<div class="f-sec" style="margin-top:10px"><div style="display:flex;gap:16px">'
   +'<button class="act" data-act="sh-paper" data-id="'+m.id+'">+ Add a paper</button>'
   +(ps.length>1?'<button class="act" data-act="sh-bundle" data-id="'+m.id+'">Assemble a bundle</button>':'')+'</div>';
  if(!ps.length)return h+'<div class="footnote" style="margin-top:12px">No papers on file yet.</div></div>';
  const kinds=['All',...new Set(ps.map(p=>p.kind))];
  const f=S.pf[m.id]||'All';
  const show=ps.filter(p=>f==='All'||p.kind===f);
  h+='<div class="kindf">'+kinds.map(k=>'<button data-act="pf" data-id="'+m.id+'" data-v="'+esc(k)+'" class="'+(f===k?'on':'')+'">'+esc(k)+(k!=='All'?' '+ps.filter(p=>p.kind===k).length:'')+'</button>').join('')+'</div>';
  h+=show.map(p=>'<div class="paper-row"><div class="pl">'+esc(p.label)+'</div>'
   +'<div class="pm">'+esc(p.kind)+' · dt. '+fmtDot(p.dt)+' · '+p.pages+' pp · '+({us:'filed by us',them:'filed by them',court:'issued by the court',client:'from the client'})[p.side]
   +(p.original?' · <b>◉ original in office</b>':'')+'</div></div>').join('');
  h+='<div class="footnote">Every paper carries its kind, its own date and whose it is — filter to Orders and the right one is in hand before the judge finishes the question.</div></div>';
  return h;
}
function fStory(m){
  const rows=storyOf(m);
  if(!rows.length)return'<div class="footnote" style="margin-top:16px">The story starts with the first record.</div>';
  return'<div class="f-sec" style="margin-top:8px">'+rows.map(r=>'<div class="story-row"><span class="sd">'+fmtDot(r.on)+'</span><span>'+esc(r.t)+'</span></div>').join('')
   +'<div class="footnote">Stitched from the diary, the papers, the fees and the cover — nothing written separately, nothing twice.</div></div>';
}
function fFees(m){
  const fees=[...(m.fees||[])].sort((a,b)=>a.on<b.on?1:-1);
  const total=fees.reduce((s,f)=>s+f.amt,0);
  let h='<div class="f-sec" style="margin-top:10px"><button class="act" data-act="sh-fee" data-id="'+m.id+'">+ Record a payment received</button>';
  if(!fees.length)return h+'<div class="footnote" style="margin-top:12px">Nothing received on this file yet. The paper diary’s back pages hold this — so must the file.</div></div>';
  h+='<div style="margin-top:8px">'+fees.map(f=>'<div class="fee-row"><span class="amt">'+inr(f.amt)+'</span><span class="mut small">'+fmt(f.on)+(f.note?' — '+esc(f.note):'')+'</span></div>').join('')+'</div>'
   +'<div class="fee-total">received on this file<b>'+inr(total)+'</b></div>'
   +'<div class="footnote">A bare record — amount, date, matter. No invoicing, no engine. Enough to retire the diary’s back pages.</div></div>';
  return h;
}
function partyHTML(pid){

  h+='<div class="pt-head"><div class="lbl">Party record</div><h1>'+esc(p.name)+'</h1><div class="sub">'
   +(p.phone?'<a href="tel:+91'+p.phone.replace(/\s/g,'')+'" style="color:var(--ink)">'+p.phone+'</a>':'no phone on record')
   +' <button class="act" data-act="sh-phone" data-id="'+pid+'" style="margin-left:8px">'+(p.phone?'edit':'add a number')+'</button>'
   +'<br>'+asC.length+' as client · '+asO.length+' as opposing party</div></div>';

  if(asC.length)h+='<div class="rule-head"><span class="lbl">As client</span></div>'+asC.map(m=>shelfRow(m)).join('');

     +'<div class="f-sec"><span class="lbl">Filing date</span><input class="tin" type="date" id="shc-filed" value="'+esc(SH.filed??m.filedOn??'')+'"></div>'
     +'<div class="f-sec"><span class="lbl">Brief facts</span><input class="tin" id="shc-facts" placeholder="One line — what this matter is about" value="'+esc(SH.facts??m.facts??'')+'"></div>'

  case'fee':{

     +'<div class="f-sec"><span class="lbl">New date</span><input class="tin" type="date" id="shm-date" value="'+esc(SH.mdate||'')+'"></div>'
     +'<div class="f-sec"><span class="lbl">Why</span><div class="optrow">'

     +'<button class="btn-ink" data-act="phone-save">Save</button>';
  }
  case'limit':{
    return'<h2>State the limitation</h2><div class="sub">'+esc(m.title)+' — you work it out; the app tracks it. It never invents a date.</div>'
     +'<div class="f-sec"><span class="lbl">What must be done</span><input class="tin" id="shl-label" placeholder="e.g. File the recovery suit" value="'+esc(SH.llabel||'')+'"></div>'
     +'<div class="f-sec"><span class="lbl">Last date</span><input class="tin" type="date" id="shl-date" value="'+esc(SH.ldate||'')+'"></div>'
     +'<div class="f-sec"><span class="lbl">Basis (your working)</span><input class="tin" id="shl-basis" placeholder="e.g. Art. 113 — 3 years from acknowledgement of 12.03.2024" value="'+esc(SH.lbasis||'')+'"></div>'
     +'<button class="btn-ink" data-act="limit-save"'+(SH.llabel&&SH.ldate?'':' disabled')+'>Set the clock</button>';
  }
  case'appealfiled':{
    return'<h2>Appeal filed</h2><div class="sub">'+esc(m.title)+'</div>'
     +'<div class="f-sec"><span class="lbl">Filed on</span><input class="tin" type="date" id="shaf-date" value="'+esc(SH.afdate||TODAY)+'"></div>'
     +'<button class="btn-ink" data-act="appealfiled-save">Record it — the clock is answered</button>';
  }
  case'clmis':{
    return'<h2>The cause list differs</h2><div class="sub">'+esc(m.title)+' — diary says '+fmt(SHEET.hon)+'. What does the court’s list say?</div>'
     +'<div class="f-sec"><span class="lbl">Court’s date</span><input class="tin" type="date" id="shcl-date" value="'+esc(SH.cldate||'')+'"></div>'
     +'<button class="btn-ink" data-act="clmis-save"'+(SH.cldate?'':' disabled')+'>Flag the mismatch</button>';
  }
  case'bundle':{
    const ps=(m.papers||[]).filter(p=>p.kind!=='Bundle');
    SH.sel=SH.sel||[];
    let h='<h2>Assemble a bundle</h2><div class="sub">'+esc(m.title)+' — tap the papers in filing order. The index writes itself from each paper’s recorded kind and date.</div>'
     +'<div class="f-sec">'+ps.map((p,i)=>{
       const ord=SH.sel.indexOf(i);
       return'<button class="b-row'+(ord>=0?' sel':'')+'" data-act="b-tog" data-v="'+i+'">'
        +'<span class="ord">'+(ord>=0?ord+1:'')+'</span><span style="flex:1"><span class="pl small" style="font-weight:600">'+esc(p.label)+'</span>'
        +'<div class="pm">'+esc(p.kind)+' · dt. '+fmtDot(p.dt)+' · '+p.pages+' pp</div></span></button>';}).join('')+'</div>';
    if(SH.sel.length){
      let pg=1;
      const rows=SH.sel.map((idx,n)=>{const p=ps[idx];const from=pg,to=pg+p.pages-1;pg=to+1;
        return'<tr><td class="num">'+(n+1)+'</td><td>'+esc(p.label)+'</td><td class="num">'+fmtDot(p.dt)+'</td><td class="num">'+from+'–'+to+'</td></tr>';}).join('');
      h+='<div class="b-index"><table><tr><th class="num">S.No</th><th>Particulars</th><th class="num">Dated</th><th class="num">Pages</th></tr>'+rows+'</table></div>'
       +'<div class="fhint">Total '+(pg-1)+' pages, continuously numbered. Swap one paper and it renumbers itself.</div>'
       +'<button class="btn-ink" data-act="b-keep">Keep on the file as the record of what was filed</button>';
    }
    return h;
  }
  case'about':{
    return'<h2>The diary that keeps itself</h2>'
     +'<p class="sub" style="margin-top:10px">Write each hearing down <b>once</b> — what the court did, the next date, anything directed — and every other page builds itself: tomorrow’s board, the dates that cannot slip, the story of each case, the papers in order.</p>'
     +'<p class="sub"><b>The desk:</b> time on the left, the day in the middle, and whichever file you pick up on the right — nothing repeated, nothing lost.</p>'
     +'<p class="sub"><b>Worth trying:</b> Close the day (two hearings pending — offer a busy date, watch the clash check answer, then see tomorrow build itself) · tomorrow’s cause-list check, where the court’s list disagrees with the diary · open <i>Bhasin v. Chandna</i> — the appeal clock reads the certified-copy papers themselves · add a Registry-objection paper to any file and watch a refile clock get born · search <b>wagle</b> · start a new matter and type <b>Narain</b>.</p>'
     +'<p class="sub"><b>Everything is capture:</b> add papers, edit covers, record hearings and results, fees in the back pages, the munshi can hold the pen — and every record you make flows to every page instantly.</p>'
     +'<p class="sub"><b>Honesty:</b> a fictional Delhi practice on a fictional Wednesday, 19 August 2026. Every name and number is invented. Nothing you type leaves this page; refresh and it is pristine again.</p>'
     +'<p class="sub"><b>Where it is wrong, say so.</b> Vocabulary that doesn’t match your court, a step that isn’t how it really happens — tell the person who sent you this link. That is the point.</p>'
     +'<button class="btn-ink" data-act="sheet-close">Back to the desk</button>';
  }
  }
  return'';
}
function renderSheet(){$('#sheet').innerHTML=sheetHTML();}
function openSheet(type,mid,extra){for(const k in SH)delete SH[k];resetF();showSheet(Object.assign({type,mid},extra||{}));}

/* ============================================================
   MUTATIONS
   ============================================================ */
function findOpenHearing(m,on){return(m.hearings||[]).find(h=>!h.outcome&&h.on===on);}
function moveListing(m,hon,newDate,why){
  const h=findOpenHearing(m,hon);if(!h)return;
  h.moved={from:h.on,why,on:TODAY};h.on=newDate;h.causeList=null;
}
function savePaper(m){
  const p={kind:SH.kind,label:SH.label.trim(),dt:SH.dt,pages:parseInt(SH.pages||'0')||1,side:SH.side||'us'};
  if(SH.orig)p.original=true;
  m.papers=m.papers||[];m.papers.push(p);
  let born='';
  if(SH.kind==='Registry objection'&&SH.refile){
    m.refile={what:'Cure registry objections & refile',by:SH.refile,born:'objection memo dt. '+fmtDot(SH.dt)};
    born=' A refile clock was born from it.';
  }
  if(SH.kind==='Order'&&SH.prot&&SH.protLabel){
    const pr={label:SH.protLabel.trim(),mode:SH.protMode||'till-next-date',born:'order dt. '+fmtDot(SH.dt)};
    if(SH.protMode==='condition'&&SH.condWhat&&SH.condBy)pr.condition={what:SH.condWhat.trim(),by:SH.condBy,who:'client'};
    m.protections=m.protections||[];m.protections.push(pr);
    born=' Its protection now rides on the dates page.';
  }
  if((SH.kind==='Copy application'||SH.kind==='Certified copy')&&m.outcome&&m.outcome.appeal)
    born=' The appeal clock recomputed from the papers.';
  toast('On the file.'+born);
}
function saveOutcome(m){
  const auto={won:'Decree in our favour',lost:'Went against us',settled:'Settled',withdrawn:'Withdrawn'};
  const o={result:SH.res,label:(SH.olabel||'').trim()||auto[SH.res],judgmentOn:SH.jdate,recordedOn:TODAY};
  if(SH.res==='lost'&&SH.forum!=null){
    const f=APPEAL_FORUMS[+SH.forum];
    o.appeal={forum:f[0],windowDays:f[1],basis:f[2],decision:'undecided'};
  }
  m.outcome=o;
  toast(SH.res==='lost'?'Recorded — the appeal clock runs from the judgment date':'Result recorded');
}

   RENDER + EVENTS + BOOT
   ============================================================ */
function render(){
  const{c,f}=parseHash();S.center=c;S.file=f;
  hideSheet();
  $('#spine').innerHTML=spineHTML();
  $('#center').innerHTML=({day:()=>vDay(S.center.date),week:vWeek,shelf:vShelf,close:vClose,new:vNew}[S.center.t]||(()=>vDay(TODAY)))();
  const fe=$('#file');fe.innerHTML=fileHTML();fe.classList.toggle('open',!!S.file);
  $('#phnav-in').innerHTML=phnavHTML();
  $('#foot').innerHTML='A working sketch — a fictional Delhi practice, Wednesday 19 August 2026. Everything is invented; nothing you type leaves this page. '
   +'<button data-act="about">About & what to try</button> · <button data-act="reset">Reset</button>';
  const key=S.center.t+(S.center.date||'');
  if(key!==render.lastKey){$('#center').scrollTop=0;window.scrollTo(0,0);}
  if(S.file&&S.file.id!==render.lastFile)fe.scrollTop=0;
  render.lastKey=key;render.lastFile=S.file&&S.file.id;
}
window.addEventListener('hashchange',render);

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,v=b.dataset.v,id=b.dataset.id;
  const m=id?byId(id):(SHEET&&SHEET.mid?byId(SHEET.mid):null);
  switch(act){
    case'day':setRoute({t:'day',date:v});break;
    case'week':setRoute({t:'week'});break;
    case'shelf':setRoute({t:'shelf'});break;
    case'new':setRoute({t:'new'});break;
    case'open-m':setRoute(null,{t:'m',id});break;
    case'open-p':hideSheet();setRoute(null,{t:'p',id});break;
    case'file-close':setRoute(null,null);break;
    case'close-start':startClose(b.dataset.mid);setRoute({t:'close'});break;
    case'pen':S.pen=v;render();toast(v==='munshi'?'The munshi holds the pen — entries will say so':'The advocate holds the pen');break;
    case'about':openSheet('about');break;
    case'reset':location.reload();break;
    case'sheet-close':hideSheet();break;
    case'mtab':S.mtab=v;render();break;
    case'ftab':S.ftab[id]=v;render();break;
    case'pf':S.pf[id]=v;render();break;
    case'copymsg':{const t=copyMsgText(byId(id));
      (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(
        ()=>toast('Copied — paste it into any message'),
        ()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Copied — paste it into any message');});
      break;}
    /* cause-list */
    case'cl-ok':{const h=findOpenHearing(byId(id),v);if(h)h.causeList={status:'verified'};render();toast('Checked against the cause list');break;}
    case'cl-keep':{const h=findOpenHearing(byId(id),v);if(h)h.causeList={status:'verified',note:'diary confirmed'};render();toast('Diary stands — noted');break;}
    case'cl-accept':{const mm=byId(id),h=findOpenHearing(mm,v);if(h){moveListing(mm,v,h.causeList.courtSays,'per the court’s cause list');render();toast('Listing moved to the court’s date — the move is on the story');}break;}
    case'cl-mis':openSheet('clmis',id,{hon:v});break;
    case'clmis-save':{const h=findOpenHearing(m,SHEET.hon);if(h)h.causeList={status:'mismatch',courtSays:SH.cldate};hideSheet();render();toast('Mismatch flagged — deal with it before the morning');break;}
    /* close flow + shared hearing form */
    case'c-out':case'h-out':F.out=v;SHEET?renderSheet():render();break;
    case'c-more-out':case'h-more-out':F.moreOut=true;SHEET?renderSheet():render();break;
    case'c-more-purp':case'h-more-purp':F.morePurp=true;SHEET?renderSheet():render();break;
    case'c-purp':case'h-purp':F.purpose=(F.purpose===v?null:v);SHEET?renderSheet():render();break;
    case'c-pres':case'h-pres':F.pres=v;SHEET?renderSheet():render();break;
    case'c-dirwho':case'h-dirwho':F.dirWho=v;SHEET?renderSheet():render();break;
    case'c-dir-toggle':case'h-dir-toggle':F.dirOpen=true;SHEET?renderSheet():render();break;
    case'c-save':{if(!F.out)break;const{m:cm,h}=F.queue[F.idx];applyCloseForm(cm,h);F.idx++;resetF();render();toast('Recorded — every page is updated');break;}
    case'c-skip':F.idx++;F.skipped++;resetF();render();break;
    /* sheets open */
    case'sh-paper':openSheet('paper',id);SH.dt=TODAY;SH.side='us';renderSheet();break;
    case'sh-hearing':openSheet('hearing',id);break;
    case'sh-outcome':openSheet('outcome',id);SH.jdate=TODAY;renderSheet();break;
    case'sh-cover':openSheet('cover',id);break;
    case'sh-fee':openSheet('fee',id);break;
    case'sh-move':openSheet('move',id,{hon:v});break;
    case'sh-phone':openSheet('phone',null,{pid:id});break;
    case'sh-limit':openSheet('limit',id);break;
    case'sh-bundle':openSheet('bundle',id);break;
    case'sh-appealfiled':openSheet('appealfiled',id);break;
    /* sheet chips */
    case'p-kind':SH.kind=v;renderSheet();break;
    case'p-side':SH.side=v;renderSheet();break;
    case'p-orig':SH.orig=!SH.orig;renderSheet();break;
    case'p-prot':SH.prot=!SH.prot;renderSheet();break;
    case'p-protmode':SH.protMode=v;renderSheet();break;
    case'o-res':SH.res=v;renderSheet();break;
    case'o-forum':SH.forum=v;renderSheet();break;
    case'm-why':SH.mwhy=v;renderSheet();break;
    case'c-complex':SH.complex=v;renderSheet();break;
    case'n-kind':N.kind=v;render();break;
    case'n-lim':N.lim=v;render();break;
    case'b-tog':{const i=+v;const at=SH.sel.indexOf(i);if(at>=0)SH.sel.splice(at,1);else SH.sel.push(i);renderSheet();break;}
    /* sheet saves */
    case'paper-save':savePaper(m);hideSheet();render();break;
    case'hearing-save':{
      const past=SH.hdate<=TODAY;
      const h={on:SH.hdate,purpose:(SH.hpurp||'').trim()||null,outcome:null,next:null};
      if(past&&F.out){applyCloseForm(m,h);}
      m.hearings=m.hearings||[];m.hearings.push(h);
      hideSheet();render();
      toast(past?(F.out?'Recorded — the diary, boards and dates all know':'Listed as a past hearing — close it when you know the outcome'):'Listed — it is on the boards now');break;}
    case'outcome-save':saveOutcome(m);hideSheet();render();break;
    case'cover-save':{
      if(SH.caseNo!==undefined)m.caseNo=SH.caseNo.trim()||null;else if(m.caseNo===undefined)m.caseNo=null;
      if(SH.cnr!==undefined)m.cnr=SH.cnr.trim()||null;
      if(SH.court!==undefined)m.court=SH.court.trim()||null;
      if(SH.complex)m.complex=SH.complex;
      if(SH.filed!==undefined&&SH.filed)m.filedOn=SH.filed;
      if(SH.facts!==undefined)m.facts=SH.facts.trim()||null;
      if(m.filedOn&&m.side==='pre-filing')m.side='we act for the plaintiff';
      hideSheet();render();toast('Cover saved — findable the way the court names it');break;}
    case'fee-save':{m.fees=m.fees||[];m.fees.push({on:SH.fdate||TODAY,amt:parseInt(SH.amt)||0,note:(SH.note||'').trim()||null});hideSheet();render();toast('Received — on the file, on the story');break;}
    case'move-save':{moveListing(m,SHEET.hon,SH.mdate,SH.mwhy);hideSheet();render();toast('Listing moved — no blank line, and the move is on the story');break;}
    case'phone-save':{P(SHEET.pid).phone=(SH.num||'').trim()||null;hideSheet();render();toast('Saved — every call list finds it now');break;}
    case'limit-save':{m.limitation={state:'stated',label:SH.llabel.trim(),by:SH.ldate,basis:(SH.lbasis||'').trim()||('Stated by counsel on '+fmtDot(TODAY))};hideSheet();render();toast('The clock is set — stated, not invented');break;}
    case'limit-met':{m.limitation.met=TODAY;render();toast('Met — the warning retires');break;}
    case'appealfiled-save':{m.outcome.appeal.decision='filed';m.outcome.appeal.filedOn=SH.afdate||TODAY;hideSheet();render();toast('Appeal filed — the clock is answered');break;}
    case'appeal-drop':{m.outcome.appeal.decision='dropped';render();toast('Noted — the window stays watched till it truly closes');break;}
    case'appeal-undecide':{m.outcome.appeal.decision='undecided';render();toast('Back on the clock');break;}
    case'dir-done':{const[hon,what]=v.split('|');
      for(const h of m.hearings||[])for(const d of h.directions||[])
        if(h.on===hon&&d.what===what)d.done=TODAY;
      render();toast('Done — struck off everywhere');break;}
    case'refile-done':{m.refile.done=TODAY;render();toast('Refiled — the clock retires');break;}
    case'cond-met':{for(const pr of m.protections||[])if(pr.condition)pr.condition.met=TODAY;render();toast('Condition met — the protection holds');break;}
    case'archive':{m.archived=true;
      const org=(m.papers||[]).filter(p=>p.original).length;
      render();toast(org?('Put away — '+org+' client original'+(org>1?'s':'')+' still in the office: return them'):'Put away — still searchable forever');break;}
    case'b-keep':{
      const ps=(m.papers||[]).filter(p=>p.kind!=='Bundle');
      const pp=SH.sel.reduce((s,i)=>s+ps[i].pages,0);
      m.papers.push({kind:'Bundle',label:'Paper-book with court-style index ('+SH.sel.length+' papers, '+pp+' pp)',dt:TODAY,pages:pp,side:'us'});
      hideSheet();render();toast('Kept on the file — the record of what was filed');break;}
    case'n-save':if(N.client.trim()&&N.opp.trim()&&N.lim)saveNew();break;
  }
});

    case'c-dirby':case'h-dirby':F.dirBy=el.value;break;
    case'n-client':N.client=el.value;$('#n-client-conf').innerHTML=conflictHTML(N.client);syncBtn('n-save',N.client.trim()&&N.opp.trim()&&N.lim);break;
    case'n-opp':N.opp=el.value;$('#n-opp-conf').innerHTML=conflictHTML(N.opp);syncBtn('n-save',N.client.trim()&&N.opp.trim()&&N.lim);break;
    case'n-limdate':N.limDate=el.value;break;
    case'n-facts':N.facts=el.value;break;
    case'shc-facts':SH.facts=el.value;break;
    case'shp-label':SH.label=el.value;syncBtn('paper-save',SH.label&&SH.kind&&SH.dt);break;
    case'shp-dt':SH.dt=el.value;syncBtn('paper-save',SH.label&&SH.kind&&SH.dt);break;
    case'shp-pages':SH.pages=el.value;break;
    case'shp-refile':SH.refile=el.value;break;
    case'shp-protlabel':SH.protLabel=el.value;break;
    case'shp-condwhat':SH.condWhat=el.value;break;
    case'shp-condby':SH.condBy=el.value;break;
    case'shh-date':SH.hdate=el.value;syncBtn('hearing-save',!!SH.hdate);break;
    case'shh-purp':SH.hpurp=el.value;break;
    case'sho-label':SH.olabel=el.value;break;
    case'sho-jdate':SH.jdate=el.value;syncBtn('outcome-save',SH.res&&SH.jdate&&(SH.res!=='lost'||SH.forum!=null));break;
    case'shc-caseno':SH.caseNo=el.value;break;
    case'shc-cnr':SH.cnr=el.value;break;
    case'shc-court':SH.court=el.value;break;
    case'shc-filed':SH.filed=el.value;break;
    case'shf-amt':SH.amt=el.value;syncBtn('fee-save',!!SH.amt);break;
    case'shf-date':SH.fdate=el.value;break;
    case'shf-note':SH.note=el.value;break;
    case'shm-date':SH.mdate=el.value;{const c=$('#shm-clash');
      if(c&&SH.mdate)c.innerHTML=clashLineHTML(SH.mdate,SHEET.mid);
      else if(SH.mdate)renderSheet();}syncBtn('move-save',SH.mdate&&SH.mwhy);break;
    case'shph-num':SH.num=el.value;break;
    case'shl-label':SH.llabel=el.value;syncBtn('limit-save',SH.llabel&&SH.ldate);break;
    case'shl-date':SH.ldate=el.value;syncBtn('limit-save',SH.llabel&&SH.ldate);break;
    case'shl-basis':SH.lbasis=el.value;break;
    case'shaf-date':SH.afdate=el.value;break;
    case'shcl-date':SH.cldate=el.value;syncBtn('clmis-save',!!SH.cldate);break;
  }
});
function syncBtn(act,ok){const b=document.querySelector('[data-act="'+act+'"]');if(b)b.disabled=!ok;}
render();
</script>
</body>
</html>
