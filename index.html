<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LegalPen — a diary that keeps itself</title>
<style>
/* ============================================================
   LegalPen demo v2 — one calm column, paper and ink.
   ============================================================ */
:root{
  --paper:#f7f4ee;
  --card:#fffefb;
  --ink:#211c15;
  --mut:#71685c;
  --faint:#9a9184;
  --line:#e5ded2;
  --line-soft:#eee9df;
  --ox:#7c2b23;          /* oxblood — the one accent */
  --ox-deep:#5f1f19;
  --ox-wash:#f6ebe8;
  --amber-ink:#7a5410;
  --amber-wash:#f6ecd7;
  --red:#a63324;
  --red-wash:#f7e9e5;
  --green:#2f6b48;
  --green-wash:#e9f1ea;
  --serif:'Iowan Old Style',Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --maxw:680px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);color:var(--ink);background:var(--paper);
  font-size:16px;line-height:1.5;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
input,select{font:inherit;color:inherit}
a{color:var(--ox);text-decoration:none}
.num{font-variant-numeric:tabular-nums}
button:focus-visible,input:focus-visible{outline:2px solid var(--ox);outline-offset:2px;border-radius:4px}

/* ---------- header ---------- */
header{
  max-width:var(--maxw);margin:0 auto;padding:18px 20px 6px;
  display:flex;align-items:baseline;gap:12px;
}
.wordmark{font-family:var(--serif);font-size:22px;letter-spacing:.2px}
.wordmark b{color:var(--ox);font-weight:700}
.demo-chip{
  margin-left:auto;font-size:12px;color:var(--faint);text-align:right;line-height:1.35;
}
.demo-chip button{color:var(--ox);font-size:12px;padding:0}

/* ---------- nav ---------- */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:rgba(255,254,251,.94);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-in{max-width:var(--maxw);margin:0 auto;display:flex}
nav button{
  flex:1;text-align:center;padding:11px 0 9px;font-size:12.5px;color:var(--mut);
  display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;
}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ox-deep)}
nav button .ndot{
  position:absolute;top:7px;left:calc(50% + 12px);width:7px;height:7px;border-radius:50%;
  background:var(--ox);
}
@media(min-width:760px){
  body{padding-bottom:40px}
  nav{position:static;background:none;border:none;-webkit-backdrop-filter:none;backdrop-filter:none}
  .nav-in{padding:2px 20px 0;gap:4px;justify-content:flex-start}
  nav button{flex:none;flex-direction:row;gap:7px;font-size:14.5px;padding:8px 14px;border-radius:8px}
  nav button svg{width:17px;height:17px}
  nav button.on{background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
  nav button .ndot{position:static;margin-left:2px}
}

/* ---------- main column ---------- */
main{max-width:var(--maxw);margin:0 auto;padding:8px 20px 32px}
.page-head{margin:14px 0 4px}
.page-head h1{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.2}
.page-head .sub{color:var(--mut);font-size:14.5px;margin-top:3px}
.backrow{margin:12px 0 0}
.backrow button{color:var(--ox);font-size:14.5px;padding:4px 0}

/* ---------- sections ---------- */
.sect{margin-top:26px}
.sect-label{
  font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
  display:flex;align-items:baseline;gap:8px;margin-bottom:8px;
}
.sect-label .lnk{margin-left:auto;letter-spacing:0;text-transform:none;font-size:13.5px;color:var(--ox)}

/* ---------- generic list card ---------- */
.list{
  background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
}
.row{padding:13px 16px;border-top:1px solid var(--line-soft);display:block;width:100%}
.row:first-child{border-top:none}
button.row:active{background:var(--paper)}
.row .r1{display:flex;align-items:baseline;gap:10px}
.row .title{font-family:var(--serif);font-size:16.5px;font-weight:600}
.row .aside{margin-left:auto;flex-shrink:0}
.row .meta{color:var(--mut);font-size:13.5px;margin-top:2px}
.row .meta b{color:var(--ink);font-weight:600}
.quiet{color:var(--mut)} .faint{color:var(--faint)}
.small{font-size:13.5px}

/* pills */
.pill{
  display:inline-block;font-size:12px;font-weight:600;border-radius:99px;
  padding:2px 9px;white-space:nowrap;
}
.pill.amber{background:var(--amber-wash);color:var(--amber-ink)}
.pill.red{background:var(--red-wash);color:var(--red)}
.pill.green{background:var(--green-wash);color:var(--green)}
.pill.plain{background:var(--paper);color:var(--mut);border:1px solid var(--line)}
.pill.ox{background:var(--ox-wash);color:var(--ox-deep)}

/* day strips on Today */
.court-group{margin-top:14px}
.court-group:first-child{margin-top:0}
.court-name{
  font-size:13px;font-weight:650;color:var(--ox-deep);margin:0 2px 6px;
  display:flex;align-items:baseline;gap:8px;
}
.court-name .trip{color:var(--faint);font-weight:500;font-size:12.5px}

.listing .r1 .caseno{font-size:13px;color:var(--mut);font-weight:500}
.listing .where{color:var(--mut);font-size:13.5px;margin-top:1px}
.listing .last{color:var(--mut);font-size:13.5px;margin-top:4px}
.listing .last b{color:var(--ink);font-weight:600}
.listing .done-line{margin-top:4px;font-size:13.5px;color:var(--green)}
.listing .chips{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}

/* attention strip */
.strip{
  border-radius:12px;padding:13px 16px;margin-top:14px;
  display:flex;gap:12px;align-items:center;width:100%;
}
.strip.amber{background:var(--amber-wash)}
.strip.amber .go{color:var(--amber-ink)}
.strip .t{font-size:14.5px;line-height:1.45}
.strip .t b{font-weight:650}
.strip .go{margin-left:auto;font-weight:650;font-size:14px;white-space:nowrap}

/* try chips */
.tries{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tries button{
  font-size:13px;color:var(--ox-deep);background:var(--card);
  border:1px solid var(--line);border-radius:99px;padding:6px 12px;
}

/* date check */
.datecheck{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.datecheck .lead{font-size:14px;color:var(--mut);margin-bottom:8px}
.datecheck input[type=date]{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;
  background:var(--paper);font-size:16px;
}
.clash-note{margin-top:10px;font-size:14px;line-height:1.5;border-radius:9px;padding:10px 12px}
.clash-note.ok{background:var(--green-wash);color:var(--green)}
.clash-note.warn{background:var(--amber-wash);color:var(--amber-ink)}
.clash-note.bad{background:var(--red-wash);color:var(--red)}

/* due rows */
.due .due-title{font-weight:600;font-size:15.5px}
.due .prov{color:var(--faint);font-size:12.5px;margin-top:3px}
.due .cost{color:var(--mut);font-size:13.5px;margin-top:2px}

/* week */
.day-block{margin-top:18px}
.day-head{display:flex;align-items:baseline;gap:10px;margin-bottom:7px}
.day-head .d{font-size:15px;font-weight:650}
.day-head .d.today{color:var(--ox-deep)}
.day-head .note{color:var(--faint);font-size:13px}
.day-empty{color:var(--faint);font-size:14px;padding:2px 2px 0}

/* matters */
.searchbar{position:relative;margin-top:12px}
.searchbar input{
  width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:11px 14px;font-size:16px;
}
.searchbar input::placeholder{color:var(--faint)}
.mtabs{display:flex;gap:6px;margin-top:12px;align-items:center}
.mtabs button{font-size:13.5px;color:var(--mut);padding:5px 12px;border-radius:99px;border:1px solid transparent}
.mtabs button.on{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:600}
.mtabs .newbtn{margin-left:auto;color:var(--ox);font-weight:600}
.why{font-size:12.5px;color:var(--ox-deep);margin-top:3px}

/* matter page */
.cover{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;margin-top:14px}
.cover h1{font-family:var(--serif);font-size:23px;font-weight:650;line-height:1.25}
.cover .kindline{color:var(--mut);font-size:14px;margin-top:2px}
.cover dl{margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14.5px}
.cover dt{color:var(--faint)}
.cover dd b{font-weight:650}
.cover .party-btn{color:var(--ox);font-weight:500}
.cover .cover-actions{display:flex;gap:16px;margin-top:14px;border-top:1px solid var(--line-soft);padding-top:11px}
.cover .cover-actions button{font-size:14px;color:var(--ox);font-weight:550}
.cover .cover-actions .muted-act{color:var(--faint);font-weight:500}
.result-line{margin-top:10px;font-size:14.5px;padding:9px 12px;border-radius:9px;background:var(--paper)}

.tabs{display:flex;gap:2px;margin-top:18px;border-bottom:1px solid var(--line)}
.tabs button{font-size:14.5px;color:var(--mut);padding:8px 13px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ox-deep);font-weight:650;border-bottom-color:var(--ox)}

.diary-entry{padding:13px 16px;border-top:1px solid var(--line-soft)}
.diary-entry:first-child{border-top:none}
.diary-entry .dline{display:flex;align-items:baseline;gap:10px}
.diary-entry .don{font-weight:650;font-size:14.5px;white-space:nowrap}
.diary-entry .purp{margin-left:auto;color:var(--faint);font-size:12.5px;flex-shrink:0;text-align:right}
.diary-entry .what{margin-top:3px;font-size:14.5px}
.diary-entry .what .det{color:var(--mut)}
.diary-entry .next-line{margin-top:3px;font-size:13.5px;color:var(--mut)}
.diary-entry .dirline{margin-top:5px;font-size:13.5px;color:var(--mut)}
.diary-entry .dirline .tick{color:var(--green)}
.diary-entry.blank .what{color:var(--red)}

.paper-row .plabel{font-weight:600;font-size:15px}
.paper-row .pmeta{color:var(--mut);font-size:13px;margin-top:2px}
.kindf{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.kindf button{font-size:12.5px;color:var(--mut);padding:4px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card)}
.kindf button.on{background:var(--ox-wash);border-color:transparent;color:var(--ox-deep);font-weight:600}

.story-row{display:flex;gap:14px;padding:9px 16px;border-top:1px solid var(--line-soft);font-size:14px}
.story-row:first-child{border-top:none}
.story-row .sd{color:var(--faint);white-space:nowrap;font-size:13px;padding-top:1px;width:74px;flex-shrink:0}

/* forms & close flow */
.formcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.f-label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:16px 0 7px}
.f-label:first-child{margin-top:0}
.chiprow{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  font-size:14px;padding:7px 13px;border-radius:99px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);
}
.chip.on{background:var(--ox);border-color:var(--ox);color:#fff;font-weight:550}
.chip.more{color:var(--ox);border-style:dashed}
.tinput{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;
  background:var(--paper);font-size:16px;
}
.tinput::placeholder{color:var(--faint)}
.f-hint{font-size:12.5px;color:var(--faint);margin-top:5px}
.btn{
  display:block;width:100%;text-align:center;border-radius:11px;padding:13px;
  font-size:16px;font-weight:650;margin-top:14px;
}
.btn.primary{background:var(--ox);color:#fff}
.btn.primary:disabled{background:#c9aca7;cursor:default}
.btn.ghost{color:var(--mut);font-weight:500;font-size:14.5px;padding:10px;margin-top:4px}
.close-head{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.close-head .prog{margin-left:auto;color:var(--faint);font-size:13.5px}
.hearing-id .t{font-family:var(--serif);font-size:19px;font-weight:650}
.hearing-id .m{color:var(--mut);font-size:14px;margin-top:2px}

/* done screen */
.done-hero{text-align:center;padding:44px 10px 10px}
.done-hero .big{font-family:var(--serif);font-size:24px;font-weight:650}
.done-hero .sub{color:var(--mut);margin-top:8px;font-size:15px}
.done-hero .tick{
  width:52px;height:52px;border-radius:50%;background:var(--green-wash);color:var(--green);
  font-size:26px;line-height:52px;margin:0 auto 16px;
}

/* party */
.party-head{margin-top:14px}
.party-head h1{font-family:var(--serif);font-size:24px;font-weight:650}
.party-head .sub{color:var(--mut);font-size:14.5px;margin-top:3px}

/* sheet + toast */
#sheetwrap{position:fixed;inset:0;z-index:60;display:none}
#sheetwrap.open{display:block}
#sheetwrap .shade{position:absolute;inset:0;background:rgba(30,24,16,.42)}
#sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:86%;overflow:auto;
  background:var(--card);border-radius:18px 18px 0 0;padding:22px 20px calc(26px + env(safe-area-inset-bottom));
}
@media(min-width:760px){
  #sheet{left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%);
    width:520px;border-radius:16px;max-height:82%}
}
#sheet h2{font-family:var(--serif);font-size:20px;font-weight:650;margin-bottom:10px}
#sheet p{font-size:14.5px;color:var(--mut);margin-top:8px}
#sheet p b{color:var(--ink)}
#sheet ul{margin:8px 0 0 18px;font-size:14.5px;color:var(--mut)}
#sheet li{margin-top:5px}
#toast{
  position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);font-size:14px;padding:9px 16px;border-radius:99px;
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:80;white-space:nowrap;
}
#toast.show{opacity:1}
footer{
  max-width:var(--maxw);margin:0 auto;padding:6px 20px 20px;
  color:var(--faint);font-size:12.5px;line-height:1.6;
}
footer button{color:var(--ox);font-size:12.5px}
</style>
</head>

<nav><div class="nav-in" id="nav"></div></nav>

<footer id="foot"></footer>
<div id="sheetwrap"><div class="shade" data-act="sheet-close"></div><div id="sheet"></div></div>

'use strict';
/* ============================================================
   Fixed demo clock. Everything is dated around Wed 19 Aug 2026
   and hand-checked: weekdays only, forum-correct windows.
   ============================================================ */
const TODAY='2026-08-19';
const MS=86400000;
const DW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DWS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fromISO(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function dow(s){return fromISO(s).getDay();}
function addDays(s,n){const d=fromISO(s);d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function daysUntil(s){return Math.round((fromISO(s)-fromISO(TODAY))/MS);}
function fmt(s){const d=fromISO(s);return DWS[d.getDay()]+' '+d.getDate()+' '+MO[d.getMonth()];}
function fmtY(s){const d=fromISO(s);return DWS[d.getDay()]+' '+d.getDate()+' '+MO[d.getMonth()]+(d.getFullYear()===2026?'':' '+d.getFullYear());}
function fmtDot(s){const[y,m,d]=s.split('-');return d+'.'+m+'.'+y;}
function fmtLong(s){const d=fromISO(s);return DW[d.getDay()]+' '+d.getDate()+' '+MO[d.getMonth()]+' '+d.getFullYear();}
function rel(s){const n=daysUntil(s);
  if(n===0)return'today';if(n===1)return'tomorrow';if(n===-1)return'yesterday';
  return n>0?('in '+n+' days'):(Math.abs(n)+' days ago');}
function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const $=s=>document.querySelector(s);
let toastT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400);}

};
function P(id){return PARTIES[id]||{name:'—'};}

/* ============================================================

   Deep matters carry full diaries and papers; the rest carry a
   cover and a next date, like most files on a real shelf.
   Outcome codes are picked; the one-line detail is the lawyer's

const MATTERS=[

 kind:'Partition suit',court:'Tis Hazari (Civil Judge-02)',complex:'Tis Hazari',

/* ============================================================
   DERIVATIONS — every board below is a query over the records
   above. A matter has ONE current listing: its earliest hearing
   still without an outcome, or the next date given at the last
   closed hearing. Nothing is stored twice.
   ============================================================ */
function cName(m){return m.client&&m.client.length?P(m.client[0]).name:(m.clientName||'—');}
function oName(m){return m.opp&&m.opp.length?P(m.opp[0]).name:(m.oppName||'—');}
function open_(){return MATTERS.filter(m=>!m.archived);}
function closedHearings(m){return (m.hearings||[]).filter(h=>h.outcome);}
function lastClosed(m){const c=closedHearings(m);return c.length?c[c.length-1]:null;}
function currentListing(m){
  if(m.outcome)return null;
  const openH=(m.hearings||[]).find(h=>!h.outcome);
  if(openH)return{on:openH.on,purpose:openH.purpose,presence:openH.presence,room:openH.room,item:openH.item,h:openH,unrecorded:openH.on<=TODAY};
  const lc=lastClosed(m);
  if(lc&&lc.next)return{on:lc.next.on,purpose:lc.next.purpose,presence:lc.next.presence,virtual:true};
  return null;
}
function listingsOn(date,exceptId){
  const out=[];
  for(const m of open_()){
    if(m.id===exceptId)continue;
    for(const h of closedHearings(m))if(h.on===date)out.push({m,on:date,purpose:h.purpose,room:h.room,item:h.item,presence:h.presence,outcome:h.outcome,next:h.next});
    const cur=currentListing(m);
    if(cur&&cur.on===date&&!(cur.h&&cur.h.outcome))
      if(!out.some(x=>x.m===m&&x.on===date))out.push({m,...cur});
  }
  return out;
}
function unrecorded(){
  const out=[];
  for(const m of open_())for(const h of m.hearings||[])
    if(!h.outcome&&h.on<=TODAY)out.push({m,h});
  return out.sort((a,b)=>a.h.on<b.h.on?-1:1);
}
function appealLastDay(o){
  const a=o.appeal;if(!a)return null;
  const base=addDays(o.judgmentOn,a.windowDays);            // s.12(1): the judgment day itself is excluded
  const copyDays=a.copyAppliedOn&&a.copyReceivedOn?daysBetweenIncl(a.copyAppliedOn,a.copyReceivedOn):0;
  return{last:addDays(base,copyDays),copyDays};
}
function daysBetweenIncl(a,b){return Math.round((fromISO(b)-fromISO(a))/MS)+1;}
function dueList(){
  const out=[];
  for(const m of MATTERS){
    if(m.archived)continue;
    for(const h of m.hearings||[])for(const d of h.directions||[])
      out.push({kind:'dir',m,due:d.by,title:d.what,who:d.who,done:d.done,
        prov:'Born at the hearing of '+fmt(h.on)+' — never entered twice.',
        cost:d.cost||(d.who==='them'?'their obligation — watch it':d.who==='client'?'the client must act — call ahead':'miss = explaining the delay to the court')});
    if(m.refile)out.push({kind:'refile',m,due:m.refile.by,title:m.refile.what,who:'us',
      prov:'Born from the '+m.refile.born+'.',cost:'miss = refiling may count as fresh — limitation trouble'});
    if(m.limitation&&m.limitation.state==='stated'&&!m.limitation.met)
      out.push({kind:'limit',m,due:m.limitation.by,title:m.limitation.label,who:'us',
        prov:m.limitation.basis,cost:'miss = the complaint becomes time-barred'});
    if(m.outcome&&m.outcome.appeal&&m.outcome.appeal.deciding==='undecided'){
      const ap=appealLastDay(m.outcome);
      out.push({kind:'appeal',m,due:ap.last,title:'Last day to appeal — '+m.outcome.appeal.forum,who:'us',
        prov:m.outcome.appeal.basis+', from the judgment of '+fmtDot(m.outcome.judgmentOn)+'; '+ap.copyDays+' days of certified-copy time excluded (s.12(2)). Verify the working before filing.',
        cost:'miss = the appeal becomes time-barred',pill:'client undecided'});
    }
    for(const pr of m.protections||[]){
      const cur=currentListing(m);
      if(pr.mode==='till-next-date'&&cur)
        out.push({kind:'prot',m,due:cur.on,title:pr.label+' — operates till this date',who:'us',
          prov:'Carried on the '+pr.born+'.',cost:'miss = the protection lapses with the date'});
    }
  }
  return out.sort((a,b)=>a.due<b.due?-1:1);
}
function overdue(){return dueList().filter(i=>i.due<TODAY&&!i.done);}
function limitationUnknowns(){return open_().filter(m=>m.limitation&&m.limitation.state==='unknown');}
function callList(){
  const out=[];
  for(const m of open_())for(const h of closedHearings(m))if(h.on===TODAY){
    const p=m.client&&m.client.length?P(m.client[0]):null;
    out.push({m,name:p?(p.short||p.name):cName(m),phone:p&&p.phone,
      line:h.outcome.label+(h.outcome.detail?' — '+h.outcome.detail:'')+(h.next?' · next '+fmt(h.next.on):'')});
  }
  return out;
}
function clashCheck(dateISO,exceptId){
  const d=dow(dateISO);
  if(d===0)return{level:'bad',msg:fmt(dateISO)+' is a Sunday — courts are closed.'};
  const ls=listingsOn(dateISO,exceptId).filter(l=>!l.outcome);
  const satNote=d===6?' It is a Saturday — confirm the bench sits.':'';
  if(!ls.length)return{level:'ok',msg:'Nothing else listed '+fmt(dateISO)+' — clear across your files.'+satNote};
  const cx=[...new Set(ls.map(l=>l.m.complex))];
  const names=ls.map(l=>l.m.caseNo+' ('+l.m.complex+')').join(' · ');
  if(cx.length===1)return{level:'ok',msg:ls.length+' already listed '+fmt(dateISO)+' — '+names+'. Same complex — one trip.'+satNote};
  if(cx.length>=3||ls.length>=4)return{level:'bad',msg:ls.length+' already listed '+fmt(dateISO)+' across '+cx.length+' complexes — '+names+'. A split morning; ask for another date while you still can.'+satNote};
  return{level:'warn',msg:ls.length+' already listed '+fmt(dateISO)+' — '+names+'. Two complexes on one morning — take this date only if you must.'+satNote};
}
function searchMatters(q){
  q=q.trim().toLowerCase();if(!q)return null;
  const hits=[];
  for(const m of MATTERS){
    let why=null;
    if(m.title.toLowerCase().includes(q))why='title';
    else if((m.caseNo||'').toLowerCase().includes(q))why='case number';
    else{
      const c=cName(m),o=oName(m);
      if(c.toLowerCase().includes(q))why='client: '+c;
      else if(o.toLowerCase().includes(q))why='opposing party: '+o;
      else if((m.court||'').toLowerCase().includes(q))why='court: '+m.court;
      else if((m.kind||'').toLowerCase().includes(q))why='matter type: '+m.kind;
      else{
        const p=(m.papers||[]).find(x=>x.label.toLowerCase().includes(q));
        if(p)why='paper: “'+p.label+'”';
        else if(m.outcome&&m.outcome.label.toLowerCase().includes(q))why='result: '+m.outcome.label;
        else if((m.filedOn||'').startsWith(q))why='filing year';
      }
    }
    if(why)hits.push({m,why});
  }
  return hits;
}
function partyMatters(pid){
  const asC=[],asO=[];
  for(const m of MATTERS){
    if((m.client||[]).includes(pid))asC.push(m);
    if((m.opp||[]).includes(pid))asO.push(m);
  }
  return{asC,asO};
}
function conflictHits(typed){
  const q=typed.trim().toLowerCase();
  if(q.length<4)return[];
  const out=[];
  for(const[pid,p]of Object.entries(PARTIES)){
    if(p.name.toLowerCase().includes(q)){
      const{asC,asO}=partyMatters(pid);
      if(asC.length||asO.length)out.push({pid,p,asC,asO});
    }
  }
  return out;
}
function storyOf(m){
  const rows=[];
  if(m.consultedOn)rows.push({on:m.consultedOn,t:'File opened — consultation.'});
  if(m.filedOn)rows.push({on:m.filedOn,t:'Filed — '+(m.court||'')+'.'});
  const hearingDates=new Set(closedHearings(m).map(h=>h.on));
  for(const h of closedHearings(m)){
    const orderSameDay=(m.papers||[]).some(p=>p.kind==='Order'&&p.dt===h.on);
    rows.push({on:h.on,t:h.outcome.label+(h.outcome.detail?' — '+h.outcome.detail:'')+(orderSameDay?' (order on file)':'')+'.'});
  }
  for(const p of m.papers||[]){
    if(hearingDates.has(p.dt))continue;   // told by that hearing's own line already
    rows.push({on:p.dt,t:p.label+' — on file.'});
  }
  if(m.outcome)rows.push({on:m.outcome.judgmentOn,t:'Result: '+m.outcome.label+'.'});
  return rows.sort((a,b)=>a.on<b.on?1:-1);
}

function partyLink(m,side){

function tabDiary(m){

  const un=unrecorded().filter(u=>u.m.id===m.id);
  let h='<div class="sect">';
  if(un.length)h+='<button class="strip amber" style="margin-top:0" data-act="close-start" data-mid="'+m.id+'"><span class="t"><b>Today’s hearing is not recorded.</b></span><span class="go">Record it →</span></button>';
  h+='<div class="list" style="margin-top:12px">';
  let newestClosed=true;
  for(const hr of hs){
    if(!hr.outcome){
      if(hr.on>TODAY)h+='<div class="diary-entry"><div class="dline"><span class="don num">'+fmt(hr.on)+'</span><span class="purp">'+esc(hr.purpose||'')+'</span></div><div class="what quiet">Listed — coming up.</div></div>';
      else h+='<div class="diary-entry blank"><div class="dline"><span class="don num">'+fmt(hr.on)+'</span><span class="purp">'+esc(hr.purpose||'')+'</span></div><div class="what">No outcome recorded — the diary has a blank line.</div></div>';
      continue;
    }
    let e='<div class="diary-entry"><div class="dline"><span class="don num">'+fmtY(hr.on)+'</span><span class="purp">'+esc(hr.purpose||'')+'</span></div>';
    e+='<div class="what">'+esc(hr.outcome.label)+(hr.outcome.detail?' <span class="det">— '+esc(hr.outcome.detail)+'</span>':'')+'</div>';

    for(const d of hr.directions||[])
      e+='<div class="dirline">'+(d.done?'<span class="tick">✓</span> ':'◻ ')+esc(d.what)+' — '+(d.who==='us'?'we act':d.who==='them'?'they act':'client acts')+' by '+fmt(d.by)+'</div>';
    e+='</div>';h+=e;newestClosed=false;

/* ---------------- Close the day ---------------- */
function resetF(){F.out=null;F.detail='';F.next='';F.purpose=null;F.pres='none';F.presName='';
  F.dirOpen=false;F.dirWhat='';F.dirWho='us';F.dirBy='';F.moreOut=false;F.morePurp=false;}
function startClose(mid){
  F.queue=unrecorded().filter(u=>!mid||u.m.id===mid);F.idx=0;F.skipped=0;resetF();
}
function chip(act,val,label,on,extra){return'<button class="chip'+(on?' on':'')+(extra||'')+'" data-act="'+act+'" data-v="'+esc(val)+'">'+esc(label)+'</button>';}
function vClose(){
  if(!F.queue)startClose();
  if(F.idx>=F.queue.length){
    const tomorrow=addDays(TODAY,1),tls=listingsOn(tomorrow),tcx=[...new Set(tls.map(l=>l.m.complex))];
    return'<div class="done-hero"><div class="tick">✓</div>'
     +'<div class="big">'+(F.skipped?'Diary closed — '+F.skipped+' skipped':'The diary is closed for today')+'</div>'
     +'<div class="sub">'+(F.skipped?'A skipped hearing stays flagged on the file — not forgotten, not fudged.':'Every view just rebuilt itself from what you recorded.')+'</div>'
     +'<div class="sub" style="margin-top:14px"><b>Tomorrow:</b> '+tls.length+' listings across '+tcx.length+' complex'+(tcx.length>1?'es':'')+'. The files to pull tonight are already on the board.</div></div>'
     +'<button class="btn primary" data-act="day" data-v="'+tomorrow+'">See tomorrow’s board</button>'
     +'<button class="btn ghost" data-act="nav" data-t="today">Back to Today — the call list is ready</button>';
  }
  const{m,h}=F.queue[F.idx];

  let out='<div class="backrow"><button data-act="nav" data-t="today">‹ Not now</button></div>'
   +'<div class="close-head"><div class="page-head" style="margin:6px 0 0"><h1>Close the day</h1></div><span class="prog num">'+(F.idx+1)+' of '+F.queue.length+'</span></div>'
   +'<div class="formcard"><div class="hearing-id"><div class="t">'+esc(m.title)+'</div>'
   +'<div class="m num">'+esc(m.caseNo||'')+' · '+esc(m.court||'')+(h.item?' · item '+h.item:'')+'</div>'
   +'<div class="m">Today’s purpose: <b>'+esc(h.purpose||'—')+'</b>'
   +(lc?'<br>Last time ('+fmt(lc.on)+'): '+esc(lc.outcome.label)+(lc.outcome.detail?' — '+esc(lc.outcome.detail):''):'')+'</div></div>';
  out+='<div class="f-label">What happened</div><div class="chiprow">'
   +OUT_PRIMARY.map(([c,l])=>chip('c-out',c,l,F.out===c)).join('')
   +(F.moreOut?OUT_MORE.map(([c,l])=>chip('c-out',c,l,F.out===c)).join(''):'<button class="chip more" data-act="c-more-out">more…</button>')
   +'</div>';
  out+='<div class="f-label">One line for the file <span style="text-transform:none;letter-spacing:0">(optional — your words)</span></div>'
   +'<input class="tinput" id="c-detail" placeholder="e.g. CW-1 cross concluded; exhibits confronted" value="'+esc(F.detail)+'" autocomplete="off">';
  out+='<div class="f-label">Next date given</div>'
   +'<input class="tinput" type="date" id="c-next" value="'+esc(F.next)+'">'
   +'<div class="f-hint">Recording late and the given date already behind us? Enter it as it is — a true past date beats a tidy future one.</div>'
   +'<div id="c-clash">'+(F.next?clashNoteHTML(F.next,m.id):'')+'</div>';
  out+='<div class="f-label">Purpose of the next date</div><div class="chiprow">'
   +PURP_PRIMARY.map(p=>chip('c-purp',p,p,F.purpose===p)).join('')
   +(F.morePurp?PURP_MORE.map(p=>chip('c-purp',p,p,F.purpose===p)).join(''):'<button class="chip more" data-act="c-more-purp">more…</button>')
   +'</div>';
  out+='<div class="f-label">Must anyone be present?</div><div class="chiprow">'
   +chip('c-pres','none','No one — counsel only',F.pres==='none')
   +chip('c-pres','client','Client — '+cName(m),F.pres==='client')
   +chip('c-pres','wit','A witness',F.pres==='wit')+'</div>'
   +(F.pres==='wit'?'<input class="tinput" id="c-presname" style="margin-top:8px" placeholder="Who — e.g. Anil Sharma (CW-1)" value="'+esc(F.presName)+'">':'');
  out+='<div class="f-label">Did the court direct anything?</div>';
  if(F.dirOpen){
    out+='<input class="tinput" id="c-dirwhat" placeholder="What — e.g. file salary affidavit with slips" value="'+esc(F.dirWhat)+'">'
     +'<div class="chiprow" style="margin-top:8px">'
     +chip('c-dirwho','us','We must act',F.dirWho==='us')+chip('c-dirwho','client','The client must',F.dirWho==='client')+chip('c-dirwho','them','They must',F.dirWho==='them')+'</div>'
     +'<input class="tinput" type="date" id="c-dirby" style="margin-top:8px" value="'+esc(F.dirBy)+'">'
     +'<div class="f-hint">The deadline is born here, inside the hearing — the dates page just collects it.</div>';
  }else out+='<button class="chip" data-act="c-dir-toggle">+ Record a direction</button>';

   +'</div>'
   +'<div class="f-hint" style="margin-top:10px;text-align:center">One entry — the boards, the dates page and the story update themselves.</div>';
  return out;
}
function clashNoteHTML(date,exceptId){
  const c=clashCheck(date,exceptId);

}
function saveClose(){
  const{m,h}=F.queue[F.idx];
  h.outcome={code:F.out,label:OUT_ALL[F.out],detail:F.detail.trim()||null};
  if(F.next){
    const pres=F.pres==='client'?{who:'client',name:cName(m)}:F.pres==='wit'?{who:'witness',name:F.presName.trim()||'a witness'}:null;
    h.next={on:F.next,purpose:F.purpose||'',presence:pres};

    h.directions=h.directions||[];

  }
  S.closed++;F.idx++;resetF();
  toast('Recorded — every view is updated');
}

function parseHash(){
  const p=(location.hash||'').replace(/^#\/?/,'').split('/');
  switch(p[0]){
    case'week':return{t:'week'};
    case'matters':return{t:'matters'};
    case'new':return{t:'new'};
    case'close':return{t:'close'};
    case'm':return{t:'matter',id:p[1]};
    case'p':return{t:'party',id:p[1]};
    case'd':return{t:'day',date:p[1]};
    default:return{t:'today'};
  }
}
function setRoute(hash){
  if(('#'+hash.replace(/^#/,''))===location.hash){render();}
  else location.hash=hash;
}
let lastKey='';
function render(){
  route=parseHash();
  hideSheet();
  const app=$('#app');
  app.innerHTML=({today:vToday,week:vWeek,matters:vMatters,new:vNew,close:vClose}[route.t]
    ||((r)=>r.t==='matter'?vMatter(r.id):r.t==='party'?vParty(r.id):r.t==='day'?vDay(r.date):vToday()))(route);
  $('#nav').innerHTML=navHTML();
  $('#foot').innerHTML=footHTML();
  const key=route.t+(route.id||'')+(route.date||'');
  if(key!==lastKey)window.scrollTo(0,0);
  lastKey=key;
}
window.addEventListener('hashchange',render);

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,v=b.dataset.v,id=b.dataset.id;
  switch(act){
    case'nav':hideSheet();setRoute('#/'+({today:'today',week:'week',matters:'matters',new:'new'})[b.dataset.t]);break;
    case'open-matter':hideSheet();setRoute('#/m/'+id);break;
    case'party':hideSheet();setRoute('#/p/'+id);break;
    case'day':setRoute('#/d/'+v);break;
    case'back':history.length>1?history.back():setRoute('#/today');break;
    case'mtab':S.mtab=v;render();break;
    case'mtab2':S.matterTab[id]=v;render();break;
    case'pf':S.paperF[id]=v;render();break;
    case'about':aboutSheet();break;
    case'ended-info':endedSheet();break;
    case'sheet-close':hideSheet();break;
    case'reset':location.reload();break;
    case'copymsg':{const m=byId(id);const t=copyMsgText(m);
      (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(
        ()=>toast('Copied — paste it into any message'),
        ()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Copied — paste it into any message');});
      break;}
    case'close-start':startClose(b.dataset.mid);setRoute('#/close');break;
    case'try-date':{const el=$('#daischeck');if(el){el.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>el.focus(),350);}break;}
    case'try-search':S.q='wagle';setRoute('#/matters');break;
    case'c-out':F.out=v;render();break;
    case'c-more-out':F.moreOut=true;render();break;
    case'c-more-purp':F.morePurp=true;render();break;
    case'c-purp':F.purpose=(F.purpose===v?null:v);render();break;
    case'c-pres':F.pres=v;render();break;
    case'c-dirwho':F.dirWho=v;render();break;
    case'c-dir-toggle':F.dirOpen=true;render();break;
    case'c-save':if(F.out){saveClose();render();}break;
    case'c-skip':F.idx++;F.skipped++;resetF();render();break;
    case'n-kind':N.kind=v;render();break;
    case'n-lim':N.lim=v;render();break;
    case'n-save':if(N.client.trim()&&N.opp.trim()&&N.lim)saveNew();break;
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  switch(el.id){
    case'daischeck':$('#daisout').innerHTML=el.value?clashNoteHTML(el.value):'';break;
    case'msearch':{S.q=el.value;const pos=el.selectionStart;render();
      const nel=$('#msearch');if(nel){nel.focus();nel.setSelectionRange(pos,pos);}break;}
    case'c-detail':F.detail=el.value;break;
    case'c-next':F.next=el.value;$('#c-clash').innerHTML=F.next?clashNoteHTML(F.next,F.queue[F.idx].m.id):'';break;
    case'c-presname':F.presName=el.value;break;
    case'c-dirwhat':F.dirWhat=el.value;break;
    case'c-dirby':F.dirBy=el.value;break;
    case'n-client':{N.client=el.value;$('#n-client-conf').innerHTML=conflictHTML(N.client);syncNewBtn();break;}
    case'n-opp':{N.opp=el.value;$('#n-opp-conf').innerHTML=conflictHTML(N.opp);syncNewBtn();break;}
    case'n-limdate':N.limDate=el.value;break;
  }
});
function syncNewBtn(){
  const btn=document.querySelector('[data-act="n-save"]');
  if(btn)btn.disabled=!(N.client.trim()&&N.opp.trim()&&N.lim);
}
render();
</script>
</body>
</html>
