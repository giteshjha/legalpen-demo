    case 'move-hearing': sheet = {kind:'move', mid: route.id, hid: el.dataset.hid, f:{}}; paintSheet(); break;
    case 'mv-why': sheet.f.why = el.dataset.v; paintSheet(); break;
    case 'mv-save': { const m = M(sheet.mid); const hr = (m.hearings || []).find(x => x.id === sheet.hid); const f = sheet.f;
      if(hr && f.to){
        /* the entry that gave this date must not go on saying the old one */
        for(const prev of m.hearings) if(prev.outcome && prev.nextOn === hr.on) prev.nextOn = f.to;
        hr.moves = hr.moves || []; hr.moves.push({from: hr.on, on: todayISO(), why: f.why});
        hr.on = f.to; hr.cl = null; save();
      }
      sheet = null; paintSheet(); render(); toast('Listing re-dated — one record, no phantom hearing'); break; }
    case 'mv-drop': { const m = M(sheet.mid); const hr = (m.hearings || []).find(x => x.id === sheet.hid);
      if(hr){ for(const prev of m.hearings) if(prev.outcome && prev.nextOn === hr.on){ prev.nextOn = null; prev.nextPurpose = null; }
        m.hearings = m.hearings.filter(x => x.id !== hr.id);
        touch(m, 'Listing of ' + fmtDot(hr.on) + ' taken off the board — ' + (sheet.f.why || 'no new date yet')); save(); }
      sheet = null; paintSheet(); render(); toast('Taken off the board — the file will show as going quiet'); break; }
    case 'party-phone': sheet = {kind:'phone', pid: el.dataset.pid, f:{phone: (PT(el.dataset.pid) || {}).phone || ''}}; paintSheet(); break;
    case 'ph-save': { const p = PT(sheet.pid); if(p) p.phone = (sheet.f.phone || '').trim() || null;
      save(); sheet = null; paintSheet(); render(); toast('Number saved — the call list can use it'); break; }
    case 'appeal-filed': { const m = M(el.dataset.mid);
      if(m.outcome && m.outcome.appeal){ m.outcome.appeal.filedOn = todayISO(); save(); toast('Appeal recorded as filed — the clock comes off'); } render(); break; }
    case 'appeal-drop': { const m = M(el.dataset.mid);
      if(m.outcome && m.outcome.appeal){ m.outcome.appeal.considering = false; save(); toast('Recorded — the window still shows until it expires'); } render(); break; }
    case 'appeal-revive': { const m = M(el.dataset.mid);
      if(m.outcome && m.outcome.appeal){ m.outcome.appeal.considering = true; save(); toast('Back on the clock'); } render(); break; }
    /* open on the listing that is actually waiting to be closed, not on today — otherwise the
       lawyer records an outcome against a hearing the court never held and the real blank line stays */
    case 'add-diary': { const m = M(route.id); const open = unclosed(m)[0];
      sheet = {kind:'adddiary', mid: route.id,
        f:{mode:'happened', on: open ? open.on : todayISO(), hp: open ? open.purpose : null}};
      paintSheet(); break; }
    /* close THIS blank line, not whichever one happens to be oldest across the practice */
    case 'record-this': { const m = M(route.id); const hr = (m.hearings || []).find(x => x.id === el.dataset.hid);
      sheet = {kind:'adddiary', mid: m.id, f:{mode:'happened', on: hr ? hr.on : todayISO(), hp: hr ? hr.purpose : null}};
      paintSheet(); break; }
    case 'dh-mode': sheet.f.mode = el.dataset.v; paintSheet(); break;
    case 'dh-out': sheet.f.out = el.dataset.v; paintSheet(); break;
    case 'dh-hp': sheet.f.hp = el.dataset.v; paintSheet(); break;
    case 'dh-np': sheet.f.np = el.dataset.v; paintSheet(); break;
    case 'dh-pres': sheet.f.presence = el.dataset.v; paintSheet(); break;
    case 'dh-diro': sheet.f.dirOpen = true; paintSheet(); break;
    case 'dh-dirk': sheet.f.dirKind = el.dataset.v; paintSheet(); break;
    case 'dh-dirw': sheet.f.dirWho = el.dataset.v; paintSheet(); break;
    case 'dh-save': { const m = M(sheet.mid); const f = sheet.f;
      const who = f.presence === 'client' ? pname(m.clientId).split('(')[0].trim()
                : f.presence === 'witness' ? (f.witness || '').trim() : null;
      let updated = false;
      if(f.mode === 'next'){
        if(!f.nextOn || !f.np){ toast('Pick the date and its purpose'); break; }
        updated = placeListing(m, f.nextOn, f.np, who, f.presence || null).wasThere;
      } else {
        if(!f.on || !f.out){ toast('Pick the hearing date and what happened'); break; }
        const existing = (m.hearings || []).find(x => !x.outcome && x.on === f.on);
        const entry = existing || {id: uid('h'), on: f.on, purpose: f.hp || 'Hearing'};
        if(f.hp) entry.purpose = f.hp;
        entry.outcome = {code: f.out, label: OUT_LABEL[f.out] || f.out, detail: (f.detail || '').trim() || null, recordedOn: todayISO()};
        if(!existing) m.hearings.push(entry);
        if(f.nextOn){
          entry.nextOn = f.nextOn; entry.nextPurpose = f.np || 'Further proceedings';
          placeListing(m, f.nextOn, f.np, who, f.presence || null);
        }
        if(f.dirOpen && f.dirKind && f.dirDue){
          m.directions.push({id: uid('dir'), kind: f.dirKind, obligor: f.dirWho || 'us', due: f.dirDue,
            bornOn: f.on, done:false, label: f.dirKind + (f.dirWho === 'them' ? ' — their obligation' : f.dirWho === 'client' ? ' — client’s undertaking' : '') + ' (recorded at hearing)'});
        }
      }
      save(); sheet = null; paintSheet(); render();
      toast(updated ? 'That listing updated — not duplicated' : 'Diary updated — every board already reflects it'); break; }
    case 'add-paper': sheet = {kind:'addpaper', mid: route.id, f:{pdate: todayISO()}}; paintSheet(); break;
    case 'ap-kind': sheet.f.pkind = el.dataset.v; paintSheet(); break;
    case 'ap-side': sheet.f.side = el.dataset.v; paintSheet(); break;
    case 'ap-orig': sheet.f.orig = !!el.dataset.v; paintSheet(); break;
    case 'ap-carry': sheet.f.carry = el.dataset.v; paintSheet(); break;
    case 'ap-save': { const m = M(sheet.mid); const f = sheet.f;
      if(!(f.label && f.label.trim()) || !f.pkind || !f.pdate || !f.side){ toast('Fill the label, kind, date and whose paper it is'); break; }
      const p = {id: uid('d'), label: f.label.trim(), pkind: f.pkind, pdate: f.pdate, side: f.side,
        pages: Math.max(1, parseInt(String(f.pages || '').replace(/\D/g,''), 10) || 4)};
      if(f.orig) p.original = {held:true};
      let extra = '';
      /* the deadline is born here, on the paper, and is never typed a second time */
      if(f.carry === 'stay-next' || f.carry === 'stay-further' || f.carry === 'stay-date'){
        const mode = f.carry === 'stay-next' ? 'till-next-date' : f.carry === 'stay-further' ? 'further-orders' : 'date';
        if(mode === 'date' && !f.cdate){ toast('Pick the date the protection runs to'); break; }
        m.protections.push({id: uid('pr'), label: p.label, mode, expiresOn: mode === 'date' ? f.cdate : null, paperId: p.id});
        p.carries = mode === 'till-next-date' ? 'protection till the next date' : mode === 'further-orders' ? 'protection till further orders' : 'protection till ' + fmtDot(f.cdate);
        extra = ' — the protection is now on your boards';
      }
      if(f.carry === 'refile' || f.carry === 'reply'){
        if(!f.cdate){ toast('Pick the date it has to be done by'); break; }
        m.directions.push({id: uid('dir'), kind: f.carry === 'refile' ? 'Refile' : 'Reply', obligor:'us', due: f.cdate,
          bornOn: p.pdate, done:false, paperId: p.id,
          label: (f.carry === 'refile' ? 'Cure objections & refile — ' : 'Reply / comply — ') + p.label});
        p.carries = (f.carry === 'refile' ? 'refile by ' : 'reply by ') + fmtDot(f.cdate);
        extra = ' — the clock it carries is now on your boards';
      }
      /* certified-copy time drops out of the appeal count, straight off these papers (s.12) */
      if(m.outcome && m.outcome.appeal){
        if(f.pkind === 'Copy application'){ m.outcome.appeal.copyAppliedOn = f.pdate; extra = ' — appeal clock corrected'; }
        if(f.pkind === 'Certified copy'){ m.outcome.appeal.copyReceivedOn = f.pdate; extra = ' — appeal clock corrected'; }
      }
      m.papers.push(p);
      save(); sheet = null; paintSheet(); render();
      toast('Paper on the file' + (extra || ' — searchable, bundleable, on the story')); break; }
    case 'paper-view': sheet = {kind:'paperview', mid: route.id, pid: el.dataset.pid}; paintSheet(); break;
    case 'pv-return': { const m = M(sheet.mid); const p = (m.papers || []).find(x => x.id === sheet.pid);
      if(p && p.original){ p.original.returnedOn = todayISO(); touch(m, p.label + ' — original returned to client.'); save(); paintSheet(); render(); toast('Return recorded with today’s date'); } break; }
    case 'copy-card': { const m = M(route.id); if(!m) break;
      const nh = nextHearing(m), lc = lastClosed(m), ap = appealLastDay(m.outcome);
      const txt = [
        m.title + (m.caseNo ? ' — ' + m.caseNo : '') + (m.court ? ', ' + m.court : ''),
        m.filedOn ? 'Filed: ' + fmtDot(m.filedOn) : null,
        /* the dated papers the Magistrate actually asks about, not just the last hearing */
        keyPapers(m).map(p => p.label + ' dt. ' + fmtDot(p.pdate)).join('; ') || null,
        lc ? 'Last hearing (' + fmtDot(lc.on) + '): ' + outText(lc.outcome) : null,
        nh ? 'Next date: ' + fmtDot(nh.on) + ' — ' + (nh.purpose || '') + (nh.presence ? ' (' + nh.presence + ' must appear)' : '') +
          (nh.cl ? ' [item ' + nh.cl.item + ', court ' + nh.cl.room + ']' : '') : null,
        m.outcome ? 'Result: ' + m.outcome.result + ' · ' + fmtDot(m.outcome.on) : null,
        ap ? 'Last day to appeal: ' + fmtDot(rollForward(ap.last)) + ' (' + ap.forum + ')' : null,
      ].filter(Boolean).join('\n');
      const ok = () => toast('Copied — ready to paste into a message');
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, () => toast(txt));
      else toast(txt);
      break; }
    case 'close-matter': sheet = {kind:'outcome', mid: route.id, f:{on: todayISO()}}; paintSheet(); break;
    case 'o-res': sheet.f.result = el.dataset.v; paintSheet(); break;
    case 'o-forum': sheet.f.forumKey = el.dataset.v; paintSheet(); break;
    case 'o-ap': sheet.f.appeal = el.dataset.v === '1'; paintSheet(); break;
    case 'o-save': { const m = M(sheet.mid); const F = sheet.f;
      const on = F.on || todayISO();
      m.status = 'closed';                                   // decided — but not shelved: archiving is its own act
      m.outcome = {result: F.result, on};
      const f = FORUM(F.forumKey);
      if(F.result === 'lost' && f){
        m.outcome.appeal = {considering: F.appeal !== false, forumKey: f.k, windowDays: f.days, forum: f.label, basis: f.basis};
        /* if the copy papers are already on the file, the exclusion applies straight away */
        const cap = (m.papers || []).find(p => p.pkind === 'Copy application');
        const crc = (m.papers || []).find(p => p.pkind === 'Certified copy');
        if(cap) m.outcome.appeal.copyAppliedOn = cap.pdate;
        if(crc) m.outcome.appeal.copyReceivedOn = crc.pdate;
      }
      /* the listing boards must stop showing a matter that is over: the hearing it was decided
         at gets closed by the result itself, and any date beyond it is simply gone */
      for(const x of (m.hearings || [])) if(!x.outcome && x.on <= on)
        x.outcome = {code:'order', label: OUT_LABEL.order, detail:'case ' + F.result, recordedOn: todayISO()};
      m.hearings = (m.hearings || []).filter(x => x.outcome);
      /* an interim protection that rode on the next date dies with the case, not into a red alarm */
      for(const pr of (m.protections || [])) if(!pr.ended && pr.mode === 'till-next-date'){ pr.ended = true; pr.endedOn = on; }
      save(); sheet = null; paintSheet(); render();
      const ap = appealLastDay(m.outcome);
      toast(ap ? 'Recorded — appeal clock runs to ' + fmtFull(rollForward(ap.last)) : 'Recorded. The file stays on your desk until you put it away.'); break; }
    case 'sheet-x': if(sheet && sheet.kind === 'about' && !S.aboutSeen){ S.aboutSeen = true; save(); } sheet = null; paintSheet(); break;
    case 'sheet-close': if(sheet && sheet.kind === 'about' && !S.aboutSeen){ S.aboutSeen = true; save(); } sheet = null; paintSheet(); break;
  }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if(id === 'q'){ searchQ = e.target.value; softRender('#q'); }
  if(id === 'n-client'){ newMatter.client = e.target.value; softRender('#n-client'); }
  if(id === 'n-opp'){ newMatter.opp = e.target.value; softRender('#n-opp'); }
  if(id === 'n-kind'){ newMatter.kind = e.target.value; }
  if(id === 'n-court'){ newMatter.court = e.target.value; }
  if(id === 'ap-label' && sheet){ sheet.f.label = e.target.value; }
  if(id === 'ap-pages' && sheet){ sheet.f.pages = e.target.value; }
  if(id === 'fb-note' && sheet){ const was = !!(sheet.f.note || '').trim(); sheet.f.note = e.target.value;
    if(was !== !!e.target.value.trim()){ const b = document.querySelector('[data-act="fb-send"]');
      if(b) e.target.value.trim() ? b.removeAttribute('disabled') : b.setAttribute('disabled',''); } }
  if(id === 'fb-who' && sheet){ sheet.f.who = e.target.value; }
  if(id === 'dh-detail' && sheet){ sheet.f.detail = e.target.value; }
  if(id === 'dh-witness' && sheet){ sheet.f.witness = e.target.value; }
  if(id === 'f-detail'){ closeQ.form.detail = e.target.value; }
  if(id === 'f-costsamt'){ closeQ.form.costs = e.target.value; }
  if(id === 'f-witness'){ closeQ.form.witness = e.target.value; }
  if(sheet){
    if(id === 'cv-case') sheet.f.caseNo = e.target.value;
    if(id === 'cv-cnr') sheet.f.cnr = e.target.value;
    if(id === 'cv-court') sheet.f.court = e.target.value;
    if(id === 'cl-item') sheet.f.item = e.target.value;
    if(id === 'cl-room') sheet.f.room = e.target.value;
    if(id === 'ph-num') sheet.f.phone = e.target.value;
    if(id === 'lm-label') sheet.f.label = e.target.value;
  }
});
/* Date fields: never rebuild the form mid-typing. Fields that only patch a box in place may
   listen to every keystroke; fields that need a repaint wait for `change`, which a date input
   fires once the whole date is there — otherwise the input is torn out from under the typist. */
function onDateField(e, committed){
  const id = e.target.id;
  const REPAINTS = ['f-dird','ap-cdate','o-on','mv-date'];
  if(REPAINTS.includes(id) && !committed){
    if(id === 'f-dird') closeQ.form.dirDue = e.target.value;
    else if(sheet) sheet.f[{['ap-cdate']:'cdate', ['o-on']:'on', ['mv-date']:'to'}[id]] = e.target.value;
    return;                                   // keep the value, leave the DOM alone
  }
  if(id === 'f-next'){ closeQ.form.nextOn = e.target.value;
    const slot = $('#clash-slot'); if(slot) slot.innerHTML = clashHTML(closeQ.form.nextOn, closeQ.curMid, (M(closeQ.curMid) || {}).court); }
  if(id === 'f-dird'){ closeQ.form.dirDue = e.target.value; render(); }
  if(id === 'n-cause'){ newMatter.causeOn = e.target.value; }
  if(id === 'dh-on' && sheet){ sheet.f.on = e.target.value; if(committed) paintSheet(); }
  if(id === 'dh-next' && sheet){ sheet.f.nextOn = e.target.value;
    const s2 = $('#dh-clash'); if(s2) s2.innerHTML = clashHTML(sheet.f.nextOn, sheet.mid, (M(sheet.mid) || {}).court); }
  if(id === 'dh-dird' && sheet){ sheet.f.dirDue = e.target.value; }
  if(id === 'ap-date' && sheet){ sheet.f.pdate = e.target.value; }
  if(id === 'ap-cdate' && sheet){ sheet.f.cdate = e.target.value; paintSheet(); }
  if(id === 'cv-filed' && sheet){ sheet.f.filedOn = e.target.value; }
  if(id === 'o-on' && sheet){ sheet.f.on = e.target.value; paintSheet(); }
  if(id === 'lm-date' && sheet){ sheet.f.by = e.target.value; }
  if(id === 'mv-date' && sheet){ sheet.f.to = e.target.value; paintSheet(); }
}
document.addEventListener('change', e => { if(e.target.type === 'date') onDateField(e, true); });
document.addEventListener('input', e => { if(e.target.type === 'date') onDateField(e, false); });
function softRender(focusSel){
  const elBefore = document.querySelector(focusSel);
  const pos = elBefore ? elBefore.selectionStart : null;
  render();
  const el = document.querySelector(focusSel);
  if(el){ el.focus(); if(pos != null){ try{ el.setSelectionRange(pos, pos); }catch(err){} } }
}
const histStack = [];
function hist(){ histStack.push(JSON.stringify(route)); }
window.addEventListener('popstate', () => {});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act="back"]');
  if(el && histStack.length){ route = JSON.parse(histStack.pop()); render(); window.scrollTo(0,0); e.stopImmediatePropagation(); }
}, true);

function paintSheet(){
  let host = $('#sheet-host');
  if(!host){ host = document.createElement('div'); host.id = 'sheet-host'; document.body.appendChild(host); }
  host.innerHTML = vSheet();
}

/* first paint — About stays until the user dismisses it once (survives double-mounts) */
render();
if(!S.aboutSeen){ sheet = {kind:'about'}; paintSheet(); }
</script>
