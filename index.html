<!doctype html>
<html>
<head>
<meta charset="utf-8">
</head>
<body>
<title>LegalPen — Practice Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    --paper:#F7F5F1; --card:#FFFFFF; --ink:#20242B; --ink-soft:#6A7080; --ink-faint:#9AA0AD;
    --line:#E5E1D8; --accent:#8C2F28; --on-accent:#FFF8F5; --accent-soft:#F5E9E7;
    --good:#2E7D4F; --good-soft:#E7F2EB; --warn:#9A5B00; --warn-soft:#F7EEDD;
    --bad:#B3261E; --bad-soft:#F9E7E5; --chip:#EFECE4; --shadow:0 1px 3px rgba(32,36,43,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#15171B; --card:#1D2026; --ink:#E9E6DF; --ink-soft:#A2A8B4; --ink-faint:#6E7480;
      --line:#2C3039; --accent:#D98A7B; --on-accent:#2A1210; --accent-soft:#33231F;
      --good:#7BC29A; --good-soft:#1E2B24; --warn:#D9A85C; --warn-soft:#2E2718;
      --bad:#E08B84; --bad-soft:#31201F; --chip:#262A32; --shadow:0 1px 3px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#15171B; --card:#1D2026; --ink:#E9E6DF; --ink-soft:#A2A8B4; --ink-faint:#6E7480;
    --line:#2C3039; --accent:#D98A7B; --on-accent:#2A1210; --accent-soft:#33231F;
    --good:#7BC29A; --good-soft:#1E2B24; --warn:#D9A85C; --warn-soft:#2E2718;
    --bad:#E08B84; --bad-soft:#31201F; --chip:#262A32; --shadow:0 1px 3px rgba(0,0,0,.35);
  }
  :root[data-theme="light"]{
    --paper:#F7F5F1; --card:#FFFFFF; --ink:#20242B; --ink-soft:#6A7080; --ink-faint:#9AA0AD;
    --line:#E5E1D8; --accent:#8C2F28; --on-accent:#FFF8F5; --accent-soft:#F5E9E7;
    --good:#2E7D4F; --good-soft:#E7F2EB; --warn:#9A5B00; --warn-soft:#F7EEDD;
    --bad:#B3261E; --bad-soft:#F9E7E5; --chip:#EFECE4; --shadow:0 1px 3px rgba(32,36,43,.08);
  }
  *{box-sizing:border-box; margin:0}
  html,body{background:var(--paper)}
  body{
    font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  #app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;
    background:var(--paper); position:relative;}
  @media (min-width:520px){ #app{border-left:1px solid var(--line); border-right:1px solid var(--line);} }
  .serif{font-family:Georgia, "Times New Roman", serif}
  .num{font-variant-numeric:tabular-nums}
  button{font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer; text-align:left}
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
  input, select{font:inherit; color:var(--ink)}

  /* App bar */
  .bar{position:sticky; top:0; z-index:20; background:var(--paper); border-bottom:1px solid var(--line);
    padding:10px 16px; display:flex; align-items:center; gap:10px; min-height:52px}
  .bar .back{font-size:22px; line-height:1; padding:4px 8px 4px 0; color:var(--accent)}
  .bar h1{font-size:17px; font-weight:650; letter-spacing:.01em; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .bar .bar-act{color:var(--accent); font-weight:600; font-size:14px; padding:6px 0 6px 8px}
  .wordmark{font-family:Georgia,serif; font-weight:700; font-size:19px; letter-spacing:.01em}
  .wordmark i{font-style:normal; color:var(--accent)}

  main{flex:1; padding:14px 14px calc(84px + env(safe-area-inset-bottom))}

  /* Bottom nav */
  .tabbar{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
    background:var(--card); border-top:1px solid var(--line); display:flex; z-index:30;
    padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:9px 0 7px; font-size:11px; font-weight:600; color:var(--ink-faint); position:relative}
  .tabbar button.on{color:var(--accent)}
  .tabbar .glyph{font-size:19px; line-height:1}
  .tabbar .dot{position:absolute; top:6px; right:calc(50% - 18px); min-width:16px; height:16px; border-radius:8px;
    background:var(--bad); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; padding:0 4px}

  /* Cards & sections */
  .sec{margin:18px 2px 8px; display:flex; align-items:baseline; justify-content:space-between}
  .sec h2{font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft)}
  .sec .hint{font-size:12px; color:var(--ink-faint)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow);
    margin-bottom:10px; overflow:hidden}
  .card .pad{padding:12px 14px}
  .row{display:block; width:100%; padding:12px 14px; border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  button.row:active{background:var(--chip)}
  .title{font-family:Georgia,serif; font-size:16px; font-weight:600; line-height:1.3}
  .meta{font-size:13px; color:var(--ink-soft); margin-top:2px}
  .meta b{color:var(--ink); font-weight:600}
  .subline{font-size:13px; color:var(--ink-soft); margin-top:6px; display:flex; gap:6px; align-items:baseline}
  .subline .lbl{font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-faint); flex:none}

  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
  .chip{font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:20px; background:var(--chip); color:var(--ink-soft)}
  .chip.accent{background:var(--accent-soft); color:var(--accent)}
  .chip.good{background:var(--good-soft); color:var(--good)}
  .chip.warn{background:var(--warn-soft); color:var(--warn)}
  .chip.bad{background:var(--bad-soft); color:var(--bad)}

  .court-h{font-size:12.5px; font-weight:700; color:var(--ink-soft); padding:10px 14px 6px; display:flex; justify-content:space-between; background:color-mix(in srgb, var(--chip) 45%, var(--card))}
  .banner{display:flex; gap:10px; align-items:flex-start; border-radius:10px; padding:12px 14px; margin-bottom:10px; font-size:13.5px; border:1px solid var(--line)}
  .banner.bad{background:var(--bad-soft); border-color:color-mix(in srgb, var(--bad) 25%, transparent)}
  .banner.warn{background:var(--warn-soft); border-color:color-mix(in srgb, var(--warn) 25%, transparent)}
  .banner .t{font-weight:700}
  .banner button{color:var(--accent); font-weight:700}

  /* Due list */
  .due{display:flex; gap:10px; padding:11px 14px; border-bottom:1px solid var(--line); align-items:flex-start; width:100%}
  .due:last-child{border-bottom:none}
  .due .when{flex:none; width:58px; text-align:center; padding-top:1px}
  .due .when .d{font-size:16px; font-weight:700; font-variant-numeric:tabular-nums}
  .due .when .m{font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint)}
  .due .what{flex:1}
  .due .what .w1{display:block; font-size:14px; font-weight:600}
  .due .what .w2{display:block; font-size:12.5px; color:var(--ink-soft); margin-top:1px}
  .left-days{font-size:11.5px; font-weight:700; border-radius:12px; padding:2px 8px; flex:none; align-self:center}
  .left-days.ok{background:var(--good-soft); color:var(--good)}
  .left-days.soon{background:var(--warn-soft); color:var(--warn)}
  .left-days.now{background:var(--bad-soft); color:var(--bad)}
  .left-days.over{background:var(--bad); color:#fff}
  .due.muted .w1, .due.muted .w2{opacity:.72}
  .cl-line{display:block; width:100%; padding:2px 0 0}
  .cl-line .chip{cursor:pointer}
  a.chip{text-decoration:none; display:inline-block}

  /* Buttons */
  .btn{display:block; width:100%; text-align:center; background:var(--accent); color:var(--on-accent);
    font-weight:700; font-size:15px; padding:13px; border-radius:10px}
  .btn:active{opacity:.85}
  .btn.ghost{background:none; color:var(--accent); border:1.5px solid var(--accent)}
  .btn.quiet{background:var(--chip); color:var(--ink)}
  .btn[disabled]{opacity:.4; pointer-events:none}
  .btn-sm{font-size:13px; font-weight:700; color:var(--accent); padding:8px 0}
  .fab{position:fixed; bottom:calc(74px + env(safe-area-inset-bottom)); right:max(16px, calc(50% - 224px));
    background:var(--accent); color:var(--on-accent); width:52px; height:52px; border-radius:26px; font-size:26px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(0,0,0,.25); z-index:25}

  /* Segmented + inputs */
  .seg{display:flex; background:var(--chip); border-radius:9px; padding:3px; margin-bottom:12px}
  .seg button{flex:1; text-align:center; font-size:13px; font-weight:600; padding:7px 4px; border-radius:7px; color:var(--ink-soft)}
  .seg button.on{background:var(--card); color:var(--ink); box-shadow:var(--shadow)}
  .field{margin-bottom:14px}
  .field label{display:block; font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:5px}
  .field input[type=text], .field input[type=tel], .field input[type=date], .field select, .field textarea{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:9px; background:var(--card); font-size:15px}
  .field textarea{font:inherit; color:var(--ink); resize:vertical; line-height:1.45}
  /* always within reach, never in the way */
  .fbtn{position:fixed; z-index:28; bottom:calc(80px + env(safe-area-inset-bottom));
    left:50%; transform:translateX(-50%); background:var(--card); border:1px solid var(--line);
    box-shadow:var(--shadow); color:var(--ink-soft); font-size:12.5px; font-weight:650;
    padding:7px 14px; border-radius:20px}
  .fbtn:active{background:var(--chip)}
  @media (min-width:1000px){ .fbtn{bottom:20px; left:auto; right:max(16px, calc(50% - 380px)); transform:none} }
  @media (min-width:1180px){ .fbtn{right:auto; left:max(8px, calc(50% - 596px)); width:196px; text-align:center} }
  .opts{display:flex; flex-wrap:wrap; gap:8px}
  .opt{border:1.5px solid var(--line); border-radius:20px; padding:8px 14px; font-size:13.5px; font-weight:600; background:var(--card)}
  .opt.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}
  .search{display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; margin-bottom:12px}
  .search input{border:none; outline:none; flex:1; font-size:15px; background:none}

  /* Diary / timeline */
  .entry{padding:12px 14px; border-bottom:1px solid var(--line)}
  .entry:last-child{border-bottom:none}
  .entry .eh{display:flex; justify-content:space-between; align-items:baseline}
  .entry .ed{font-size:13px; font-weight:700; font-variant-numeric:tabular-nums}
  .entry .body{font-size:14px; margin-top:3px}
  .entry .tag{font-size:11.5px; color:var(--ink-faint)}
  .story-dot{display:flex; gap:10px; padding:9px 14px; border-bottom:1px solid var(--line); font-size:13.5px}
  .story-dot:last-child{border-bottom:none}
  .story-dot .sd{flex:none; width:74px; color:var(--ink-faint); font-size:12px; font-variant-numeric:tabular-nums; padding-top:1px}

  /* Tabs inside matter */
  .mtabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin:14px -14px 12px; padding:0 10px; position:sticky; top:52px; background:var(--paper); z-index:10}
  .mtabs button{padding:9px 10px 8px; font-size:13.5px; font-weight:650; color:var(--ink-faint); border-bottom:2px solid transparent}
  .mtabs button.on{color:var(--accent); border-bottom-color:var(--accent)}

  .kv{display:flex; gap:12px; font-size:13.5px; padding:4px 0}
  .kv .k{flex:none; width:92px; color:var(--ink-faint)}
  .kv .v{flex:1}
  a.plink, button.plink{color:var(--accent); font-weight:600; font-family:Georgia,serif}

  /* Close-day flow */
  .qprog{font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); text-align:center; margin-bottom:8px}
  .clash{border-radius:9px; padding:10px 12px; font-size:13px; margin-top:8px}
  .clash.bad{background:var(--bad-soft); color:var(--bad); font-weight:600}
  .clash.ok{background:var(--good-soft); color:var(--good); font-weight:600}
  .clash.warn-soft{background:var(--warn-soft); color:var(--warn); font-weight:600}
  .optgroup{margin-bottom:10px}
  .optgroup:last-child{margin-bottom:0}
  .og{display:block; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:5px}
  .field input[type=text].mini{padding:9px 11px}

  /* Sheet + toast */
  .sheet-veil{position:fixed; inset:0; background:rgba(15,17,20,.45); z-index:40; display:flex; align-items:flex-end; justify-content:center}
  .sheet{background:var(--card); width:100%; max-width:480px; border-radius:16px 16px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); max-height:85vh; overflow:auto}
  .sheet h3{font-size:16px; margin-bottom:10px}
  #toast{position:fixed; bottom:calc(92px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); font-size:13.5px; font-weight:600; padding:10px 18px; border-radius:22px;
    opacity:0; transition:opacity .25s; z-index:60; pointer-events:none; max-width:88%; text-align:center}
  #toast.show{opacity:1}
  .empty{padding:26px 14px; text-align:center; color:var(--ink-faint); font-size:13.5px}
  .empty .big{font-size:15px; font-weight:600; color:var(--ink-soft); margin-bottom:3px}
  .note{font-size:12px; color:var(--ink-faint); margin:8px 2px}
  .divider{height:1px; background:var(--line); margin:16px 0}
  .index-doc{font-family:Georgia,serif; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:16px}
  .index-doc h4{text-align:center; font-size:14px; letter-spacing:.04em; margin-bottom:2px}
  .index-doc .cap{text-align:center; font-size:12px; color:var(--ink-soft); margin-bottom:12px}
  .index-doc table{width:100%; border-collapse:collapse; font-size:12.5px}
  .index-doc th, .index-doc td{border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top}
  .index-doc th{font-size:11px; letter-spacing:.04em; text-transform:uppercase}
  /* ---------- the standing panels: what the day board cannot keep in view ---------- */
  .rail, .lrail{display:none}
  .rail h3{font-size:11.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 6px 2px}
  .rail .rcard{background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); margin-bottom:14px; overflow:hidden}
  .rail .rrow{display:block; width:100%; padding:9px 12px; border-bottom:1px solid var(--line); font-size:13px}
  .rail .rrow:last-child{border-bottom:none}
  .rail button.rrow:hover{background:var(--chip)}
  .rail .rt{font-weight:650; display:block}
  .rail .rs{color:var(--ink-soft); font-size:12px; display:block; margin-top:1px}
  .rail .rk{display:flex; justify-content:space-between; gap:8px; align-items:baseline}
  .rail .big{font-size:20px; font-weight:700; font-variant-numeric:tabular-nums}
  .rail .alarm{border-color:color-mix(in srgb, var(--bad) 40%, var(--line))}
  .rail .alarm h3, .rail .alarm .rt{color:var(--bad)}

  /* ---------- laptop / desktop ---------- */
  @media (min-width:1000px){
    #app{max-width:780px}
    main{padding:18px 24px 56px}
    .tabbar{left:max(8px, calc(50% - 492px)); transform:none; top:76px; bottom:auto; width:88px;
      flex-direction:column; border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:8px 0}
    .tabbar button{padding:13px 0}
    .tabbar .dot{top:8px; right:16px}
    .sheet-veil{align-items:center; padding:24px}
    .sheet{border-radius:16px; box-shadow:0 12px 40px rgba(0,0,0,.35)}
    .wk{display:grid; grid-template-columns:1fr 1fr; column-gap:20px; align-items:start}
    .wk > .sec, .wk > .card, .wk > .banner{grid-column:1/-1}
    .wday{min-width:0}
    #toast{bottom:44px}
  }
  @media (min-width:1180px){
    .rail{display:block; position:fixed; top:76px; bottom:20px; overflow-y:auto;
      left:calc(50% + 400px); width:min(300px, calc(50vw - 410px)); padding-right:4px}
    .railable{display:none}          /* the same records, kept permanently in view instead */
    .tabbar{left:max(8px, calc(50% - 596px)); width:196px}
    .tabbar button{flex-direction:row; justify-content:flex-start; gap:12px; padding:11px 16px; font-size:13.5px}
    .tabbar .dot{position:static; margin-left:auto}
    .lrail{display:block; position:fixed; top:250px; left:max(8px, calc(50% - 596px)); width:196px}
  }
  .lrail .today-big{font-family:Georgia,serif; font-size:15px; font-weight:600; line-height:1.25; margin-bottom:2px}
  .lrail .today-sub{font-size:12px; color:var(--ink-faint); margin-bottom:12px}
  .lrail .cta{display:block; width:100%; text-align:center; background:var(--accent); color:var(--on-accent);
    font-weight:700; font-size:13.5px; padding:11px 10px; border-radius:10px; line-height:1.3}
  .lrail .cta.calm{background:var(--good-soft); color:var(--good)}
  .lrail .stat{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-soft); padding:5px 0; border-bottom:1px solid var(--line)}
  .lrail .stat:last-child{border-bottom:none}
  .lrail .stat b{color:var(--ink); font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>

<div id="app">
  <div id="screen"></div>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<button class="fbtn" data-act="feedback">Something not right? Tell us</button>
<aside class="lrail" id="lrail" aria-label="The day"></aside>
<aside class="rail" id="rail" aria-label="Standing panel"></aside>
<div id="toast" role="status"></div>

<script>
'use strict';
/* never fail to a blank page — surface any startup/render error as readable text */
window.addEventListener('error', function(e){
  try{
    var el = document.createElement('pre');
    el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#B3261E;color:#fff;padding:14px;font:12px/1.5 monospace;white-space:pre-wrap;margin:0';
    el.textContent = 'Prototype error — please screenshot this:\n' + (e.message || e.type) + '\n' + (e.filename || '') + ':' + (e.lineno || '');
    document.body.appendChild(el);
  }catch(_){}
});
/* ============================== utilities ============================== */
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MS = 86400000;
const todayISO = () => { const d = new Date(); return iso(d); };
function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fromISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(isoStr, n){ const d = fromISO(isoStr); d.setDate(d.getDate()+n); return iso(d); }
const rel = n => addDays(todayISO(), n);
const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmt(s){ if(!s) return '—'; const d = fromISO(s); return DW[d.getDay()] + ' ' + d.getDate() + ' ' + MO[d.getMonth()]; }
function fmtY(s){ if(!s) return '—'; const y = fromISO(s).getFullYear(); return fmt(s) + (y === new Date().getFullYear() ? '' : ' ' + y); }
function fmtFull(s){ if(!s) return '—'; const d = fromISO(s); return d.getDate() + ' ' + MO[d.getMonth()] + ' ' + d.getFullYear(); }
function fmtDot(s){ if(!s) return '—'; const [y,m,d] = s.split('-'); return d + '.' + m + '.' + y; }
function daysUntil(s){ return Math.round((fromISO(s) - fromISO(todayISO())) / MS); }
function relWords(s){
  const n = daysUntil(s);
  if(n === 0) return 'today'; if(n === 1) return 'tomorrow'; if(n === -1) return 'yesterday';
  return n > 0 ? 'in ' + n + ' days' : Math.abs(n) + ' days ago';
}
function urgency(s){ const n = daysUntil(s); return n <= 1 ? 'now' : n <= 7 ? 'soon' : 'ok'; }
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2400); }
const uid = p => p + Math.random().toString(36).slice(2, 9);

/* ---- where feedback goes. Put the WhatsApp number here in full international form,
   digits only, e.g. '919811022331'. Left empty, the button copies the note to the
   clipboard instead of opening WhatsApp, so it still works. ---- */
const FEEDBACK_WA = '';

/* ---- court calendar: a deadline that lands on a closed day is not really that day (s.4) ---- */
const HOLIDAYS = {
  '2026-08-15':'Independence Day', '2026-10-02':'Gandhi Jayanti', '2026-10-20':'Dussehra',
  '2026-11-08':'Diwali', '2026-12-25':'Christmas', '2027-01-26':'Republic Day',
};
function closedWhy(s){ if(!s) return null; const d = fromISO(s).getDay();
  return HOLIDAYS[s] || (d === 0 ? 'a Sunday' : d === 6 ? 'a Saturday' : null); }
function isClosed(s){ return !!closedWhy(s); }
function rollForward(s){ let x = s, i = 0; while(isClosed(x) && i++ < 12) x = addDays(x, 1); return x; }
/* months and years must land on the corresponding date, and where the month is too short,
   on its last day — never spill into the next month, which would hand the lawyer extra days
   the law does not give (cf. s.9 General Clauses Act) */
function addUnit(s, unit, n){
  const d = fromISO(s);
  if(unit === 'd'){ d.setDate(d.getDate() + n); return iso(d); }
  const day = d.getDate();
  const target = new Date(d.getFullYear() + (unit === 'y' ? n : 0), d.getMonth() + (unit === 'm' ? n : 0), 1);
  const lastDay = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
  target.setDate(Math.min(day, lastDay));
  return iso(target);
}

let S;

/* state survives the night on purpose — the habit this product bets on is a multi-day habit,
   and a diary that forgets what you wrote yesterday cannot be trialled. Reset lives in About. */
function load(){
  try{ const raw = localStorage.getItem('legalpen-proto');
    if(raw){ const p = JSON.parse(raw); if(p && p.v === 5) return p; }
  }catch(e){}
  const s = seed(); s.seedDay = todayISO(); return s;
}
S = load(); save();
const M = id => S.matters.find(m => m.id === id);
const PT = id => S.parties.find(p => p.id === id);
const pname = id => (PT(id) || {name:'—'}).name;
function touch(m, text){ m.activity = m.activity || []; m.activity.push({on: todayISO(), text}); }

/* ============================== derivations ============================== */
function nextHearing(m){ return (m.hearings || []).filter(h => !h.outcome).sort((a,b)=>a.on<b.on?-1:1)[0] || null; }
/* "last time" means last time before the day you are looking at — never an outcome
   from a hearing that, on the date shown, had not happened yet */
function lastClosed(m, beforeISO){
  return (m.hearings || []).filter(h => h.outcome && (!beforeISO || h.on < beforeISO))
    .sort((a,b) => a.on < b.on ? 1 : -1)[0] || null;
}
function unclosed(m){ return (m.hearings || []).filter(h => !h.outcome && h.on <= todayISO()); }
/* oldest blank line first — the one that has been open longest is the one that bites */
function allUnclosed(){ return S.matters.filter(m => !m.archived)
  .flatMap(m => unclosed(m).map(h => ({m, h}))).sort((a,b) => a.h.on < b.h.on ? -1 : 1); }
function listingsOn(dateISO){
  return S.matters.flatMap(m => (m.hearings || []).filter(h => h.on === dateISO).map(h => ({m, h})))
    .sort((a,b) => (a.m.court || '') < (b.m.court || '') ? -1 : 1);
}
/* the forum decides the days; the certified-copy papers decide the exclusion; the decision
   not to appeal is a decision, not a deletion — the window keeps running until it expires */
function appealLastDay(o){
  if(!o || !o.appeal || o.appeal.filedOn) return null;
  const a = o.appeal;
  const f = FORUM(a.forumKey);
  const days = a.windowDays || (f && f.days);
  if(!days) return null;
  let excl = 0;
  if(a.copyAppliedOn && a.copyReceivedOn) excl = Math.max(0, Math.round((fromISO(a.copyReceivedOn) - fromISO(a.copyAppliedOn)) / MS));
  return { last: addDays(o.on, days + excl), excl, days,
    forum: a.forum || (f && f.label) || 'the appellate court',
    basis: a.basis || (f && f.basis) || null,
    dropped: a.considering === false };
}
/* a matter's own court complex — two matters at Tis Hazari on one day is efficiency, not a clash */
function complexOf(court){ return String(court || 'Court not set').split('(')[0].trim(); }

/* every dated obligation, from records only */
/* s.4 saves you only when the act is filing something in a court that was shut. A statutory
   notice to be despatched, an undertaking to be performed, a stay that expires — none of those
   wait for the registry to reopen, and pretending they do would give the lawyer a day he has not got. */
const FILING_DIRS = ['Written statement','Reply','Rejoinder','Documents','Evidence / affidavit','Refile'];
function isCourtFiling(o){
  if(o.type === 'appeal' || o.type === 'refile') return true;
  if(o.dir) return FILING_DIRS.includes(o.dir.kind);
  if(o.type === 'limitation') return o.m.limitation && o.m.limitation.preset !== 'ni30';
  return false;
}
function dueItems(only){
  const items = [];
  const src = only || S.matters.filter(m => !m.archived);
  const push = o => {
    const filing = isCourtFiling(o);
    o.eff = filing ? rollForward(o.due) : o.due;
    o.shut = filing && o.eff !== o.due ? closedWhy(o.due) : null;
    o.shutNoRelief = !filing && isClosed(o.due) ? closedWhy(o.due) : null;
    items.push(o);
  };
  for(const m of src){
    for(const dir of (m.directions || [])){
      if(dir.done) continue;
      push({ type: dir.kind === 'Undertaking' ? 'undertaking' : dir.kind === 'Refile' ? 'refile' : 'direction',
        m, due: dir.due, label: dir.label, obligor: dir.obligor, dir,
        cost: dir.kind === 'Undertaking' ? 'breach invites contempt' :
              dir.kind === 'Refile' ? 'appeal stays under objections' :
              dir.obligor === 'us' ? 'right to file may be closed' : null });
    }
    for(const pr of (m.protections || [])){
      if(pr.ended) continue;
      const nh = nextHearing(m);
      if(pr.mode === 'further-orders') continue;            // stands until the court says otherwise
      const expiry = pr.mode === 'till-next-date' ? (nh ? nh.on : null) : pr.expiresOn;
      if(expiry) push({ type:'protection', m, due: expiry, pr,
        label: pr.label + (pr.mode === 'till-next-date' ? ' — operates till the next date' : ' — expires'),
        sub: pr.note || null,
        cost: pr.note ? 'it was not pressed last time — do not assume it survived' : 'protection lapses if not extended' });
      else if(pr.mode === 'till-next-date') push({ type:'protection-orphan', m, due: todayISO(), pr,
        label: pr.label + ' — rides on a next date that is not on record',
        sub:'record the next date, or the stay is running blind', cost:'protection may already have lapsed' });
    }
    if(m.limitation && !m.limitation.met && m.limitation.by){
      push({ type:'limitation', m, due: m.limitation.by, label: m.limitation.label,
        sub: m.limitation.basis, cost:'claim becomes time-barred' });
    }
    const ap = appealLastDay(m.outcome);
    if(ap) push({ type:'appeal', m, due: ap.last, ap,
      label: (ap.dropped ? 'Appeal window still open — ' : 'Last day to appeal — ') + ap.forum,
      sub: [ap.basis, ap.excl ? ap.excl + ' days of certified-copy time excluded' : null,
            ap.dropped ? 'recorded as not appealing — the clock runs anyway' : null].filter(Boolean).join(' · '),
      muted: ap.dropped, cost:'appeal becomes time-barred' });
    for(const h of (m.hearings || [])){
      if(!h.outcome && h.presence && h.on >= todayISO()){
        push({ type:'presence', m, due: h.on, label: h.presence + ' must appear — ' + h.purpose,
          sub:'phone: ' + (PT(m.clientId)?.phone || 'not on record'), cost:'warrant / evidence closed' });
      }
    }
  }
  return items.sort((a,b) => a.due < b.due ? -1 : 1);
}
/* a missed date does not stop mattering — it is the day condonation is still possible */
function overdue(){ const t = todayISO(); return dueItems().filter(i => i.eff < t && i.type !== 'presence'); }
/* files with nothing on the horizon at all — the quiet ones that slip. A file with a MISSED
   date is not quiet, it is late: it belongs in the overdue list, not here. */
function goingQuiet(){
  const live = new Set(dueItems().map(i => i.m.id));
  return S.matters.filter(m => !m.archived && !m.outcome && !nextHearing(m) && !live.has(m.id))
    .map(m => { const lc = lastClosed(m); return {m, since: lc ? lc.on : m.filedOn}; });
}
/* questions the file is waiting on the lawyer to answer — never a fabricated date */
function openQuestions(){
  const out = [];
  for(const m of S.matters){
    if(m.archived) continue;
    if(m.limitation && !m.limitation.met && !m.limitation.by)
      out.push({m, q:'Limitation for this cause is not worked out yet', why: m.causeLabel || 'cause recorded at intake', act:'limitation'});
    if(!m.caseNo && m.filedOn) out.push({m, q:'Filed, but no case number on the cover', why:'the number is how the court refers to it', act:'cover'});
  }
  return out;
}
function needsMyWork(m){
  return (m.directions || []).some(d => !d.done && d.obligor === 'us') ||
    (m.limitation && !m.limitation.met) ||
    !!appealLastDay(m.outcome);
}
function clashList(dateISO, exceptMatterId){
  return S.matters.flatMap(m => {
    if(m.id === exceptMatterId || m.archived) return [];
    return (m.hearings || []).filter(h => !h.outcome && h.on === dateISO).map(h => ({m, h}));
  });
}
/* one listing per matter per day: setting a date the file already has must update that
   listing, never grow a second one that shows up twice on every board */
function placeListing(m, onISO, purpose, presence, presenceKind){
  const exist = (m.hearings || []).find(h => !h.outcome && h.on === onISO);
  const target = exist || {id: uid('h'), on: onISO};
  if(purpose) target.purpose = purpose;
  else if(!target.purpose) target.purpose = 'Further proceedings';
  if(presence){ target.presence = presence; target.presenceKind = presenceKind; }
  if(!exist) m.hearings.push(target);
  return {entry: target, wasThere: !!exist};
}
/* how bad is a day, really: complexes you must be in at once, and matters that eat a morning */
function dayLoad(dateISO, exceptMatterId, addCourt){
  const list = clashList(dateISO, exceptMatterId);
  const complexes = new Set(list.map(c => complexOf(c.m.court)));
  if(addCourt) complexes.add(complexOf(addCourt));
  const heavy = list.filter(c => HEAVY_PURPOSES.includes(c.h.purpose) ||
    (lastClosed(c.m) || {}).outcome && lastClosed(c.m).outcome.code === 'part_heard');
  return {list, complexes: [...complexes], heavy};
}
const norm = s => String(s || '').toLowerCase().replace(/[^a-z\s]/g, ' ')
  .replace(/\b(m\/s|pvt|ltd|llp|co|the|smt|shri|sh|mr|mrs|md|mohd|mohammed)\b/g, ' ')
  .split(/\s+/).filter(w => w.length > 2);
/* a conflict check that fires on every Rajesh is a conflict check nobody reads */
function partyMatches(typed){
  const t = norm(typed);
  if(!t.length) return [];
  const out = [];
  for(const p of S.parties){
    const n = norm(p.name);
    const shared = t.filter(w => n.includes(w));
    if(!shared.length) continue;
    const full = shared.length >= 2 || (n.length === 1 && shared.length === 1) ||
      (t.length === 1 && n.length === 1);
    const surname = shared.length === 1 && n.length > 1 && shared[0] === n[n.length - 1];
    if(!full && !surname) continue;             // first-name-only echoes are noise, not conflicts
    out.push({p, strength: full ? 'same' : 'surname', shared});
  }
  return out;
}
function matterSearch(q){
  q = q.trim().toLowerCase();
  if(!q) return S.matters.map(m => ({m, why:null}));
  const out = [];
  for(const m of S.matters){
    const fields = [
      ['title', m.title], ['case number', m.caseNo], ['CNR', m.cnr], ['court', m.court], ['kind', m.kind],
      ['client', pname(m.clientId)],
      ...(m.oppIds || []).map(id => ['opposing party', pname(id)]),
      ...(m.tags || []).map(t => ['tag', t]),
      ...(m.papers || []).map(p => ['paper', p.label]),
      ...(m.hearings || []).filter(h => h.outcome && h.outcome.detail).map(h => ['diary', h.outcome.detail]),
      ['outcome', m.outcome ? m.outcome.result : null],
      ['filed', m.filedOn ? m.filedOn.slice(0,4) : null],
    ];
    const hit = fields.find(([k, v]) => v && String(v).toLowerCase().includes(q));
    if(hit) out.push({m, why: hit[0] === 'title' || hit[0] === 'case number' ? null : hit[0] + ': “' + hit[1] + '”'});
  }
  return out;
}

    (opts.wordmark ? '<button class="bar-act" data-act="about">About</button>' : '') +
    '</header>';
}

/* ---------- Today / any-day board ---------- */
function vDay(){
  const date = route.date;
  const t = daysUntil(date);
  const dayName = t === 0 ? 'Today' : t === 1 ? 'Tomorrow' : t === -1 ? 'Yesterday' : fmt(date);
  const listings = listingsOn(date);
  const due = dueItems().filter(i => i.eff === date && i.type !== 'presence');
  const un = allUnclosed();
  const calls = callList();
  const od = overdue();

  let h = bar('', {wordmark:true});
  h += '<main>';
  h += '<div class="seg" style="margin-bottom:14px">' +
    '<button data-act="date" data-d="' + addDays(date,-1) + '">‹ ' + esc(fmt(addDays(date,-1)).slice(0,6)) + '</button>' +
    '<button class="on">' + esc(dayName) + ' · <span class="num">' + esc(fmt(date).slice(4)) + '</span></button>' +
    '<button data-act="date" data-d="' + addDays(date,1) + '">' + esc(fmt(addDays(date,1)).slice(0,6)) + ' ›</button>' +
    '</div>';

  if(t === 0){
    const past = un.filter(u => u.h.on < todayISO());
    const todays = un.filter(u => u.h.on === todayISO());
    if(past.length){
      h += '<div class="banner bad"><div style="flex:1"><div class="t">' + past.length + ' hearing' + (past.length>1?'s':'') + ' without an outcome</div>' +
        '<div>' + past.map(u => esc(u.m.caseNo || u.m.title) + ' — listed ' + esc(fmt(u.h.on))).join(' · ') + '. The diary has a blank line, and every board below is answering with it missing.</div>' +
        '<button data-act="close-day" style="margin-top:6px">Close the day →</button></div></div>';
    } else if(todays.length){
      h += '<div class="banner warn"><div style="flex:1"><div class="t">Back from court?</div>' +
        '<div>' + todays.length + ' hearing' + (todays.length>1?'s':'') + ' today still to be recorded — five minutes, then every board updates itself.</div>' +
        '<button data-act="close-day" style="margin-top:6px">Close the day →</button></div></div>';
    }
  }

  /* a missed date is not gone — it is the day condonation is still possible */
  if(t === 0 && od.length){
    h += '<div class="railable"><div class="sec"><h2>Already past — still on your desk</h2><span class="hint">' + od.length + '</span></div>' +
      '<div class="card">' + od.map(dueRow).join('') +
      '<div class="pad" style="border-top:1px solid var(--line)"><p class="note" style="margin:0">A missed date stays here until it is dealt with. On paper the unstruck line keeps staring back; nothing should quietly drop off a screen.</p></div></div></div>';
  }

  const complexes = [...new Set(listings.map(l => complexOf(l.m.court)))];
  h += '<div class="sec"><h2>Listed ' + esc(dayName.toLowerCase()) + '</h2><span class="hint">' +
    listings.length + ' matter' + (listings.length===1?'':'s') + (complexes.length > 1 ? ' · ' + complexes.length + ' complexes' : '') + '</span></div>';
  if(complexes.length > 2){
    h += '<div class="banner bad"><div><div class="t">' + complexes.length + ' court complexes in one morning</div>' +
      esc(complexes.join(' · ')) + ' — decide tonight which one you attend and who covers the rest.</div></div>';
  }
  if(!listings.length){
    h += '<div class="card"><div class="empty"><div class="big">Nothing listed — drafting time</div>Deadlines below still apply.</div></div>';
  } else {
    const openL = listings.filter(l => !l.h.outcome);
    const checked = openL.filter(l => l.h.cl).length;
    let lastCourt = null; let openCard = false;
    for(const {m, h: hr} of listings){
      if(m.court !== lastCourt){
        if(openCard) h += '</div>';
        h += '<div class="card">';
        h += '<div class="court-h"><span>' + esc(m.court || 'Court not set') + '</span></div>';
        lastCourt = m.court; openCard = true;
      }
      const lc = lastClosed(m, date);
      h += '<div class="row" style="padding-bottom:8px">' +
        '<button data-act="open-matter" data-id="' + m.id + '" style="display:block; width:100%">' +
        '<div class="title">' + esc(m.title) + '</div>' +
        '<div class="meta num">' + esc(m.caseNo || 'pre-filing') + ' · ' + esc(hr.purpose) + '</div>' +
        (lc ? '<div class="subline"><span class="lbl">Last time</span><span>' + esc(outText(lc.outcome)) + '</span></div>' : '') +
        chipRow([
          hr.presence ? ['bad', '⚠ ' + hr.presence + ' must appear'] : null,
          ...promiseChips(m),
          (m.protections || []).some(pr => !pr.ended && pr.mode === 'till-next-date') ? ['warn','Interim protection rides on this date'] : null,
        ]) + '</button>' +
        (hr.outcome
          ? '<div class="cl-line"><span class="chip good">✓ recorded — ' + esc(OUT_CHIP[hr.outcome.code] || hr.outcome.label) + '</span></div>'
          : '<button class="cl-line" data-act="cl-open" data-mid="' + m.id + '" data-hid="' + hr.id + '">' +
            (hr.cl ? '<span class="chip good">✓ item ' + esc(hr.cl.item) + ' · court ' + esc(hr.cl.room) + '</span>'
                   : '<span class="chip">＋ item no. / court no. from the cause list</span>') + '</button>') +
        '</div>';
    }
    if(openCard) h += '</div>';
    if(openL.length) h += '<p class="note">Cause list: ' + checked + ' of ' + openL.length + ' checked. The court’s list is the authority — this board is your record of having read it.</p>';
  }

  h += '<div class="sec"><h2>Also due ' + esc(dayName.toLowerCase()) + '</h2></div>';
  h += due.length ? '<div class="card">' + due.map(dueRow).join('') + '</div>'
    : '<div class="card"><div class="empty">Nothing else falls due ' + esc(dayName.toLowerCase()) + '.</div></div>';

  if(t === 0 && calls.length){
    h += '<div class="sec"><h2>Clients to call tonight</h2><span class="hint">from the diary</span></div><div class="card">';
    for(const c of calls){
      h += '<div class="row"><div style="display:flex; justify-content:space-between; gap:8px; align-items:center">' +
        '<div style="flex:1"><b>' + esc(c.name) + '</b>' +
        '<div class="meta">' + esc(c.caseNo) + ' — ' + esc(c.outcome) + (c.next ? ' · next ' + esc(fmt(c.next)) : '') +
        (c.late ? ' · <span style="color:var(--warn)">recorded late — call still owed</span>' : '') + '</div></div>' +
        (c.phone ? '<span style="display:flex; gap:6px; flex:none">' +
          '<a class="chip accent" href="tel:' + esc(c.phone.replace(/\s/g,'')) + '">call</a>' +
          '<a class="chip" href="https://wa.me/91' + esc(c.phone.replace(/\D/g,'')) + '" target="_blank" rel="noopener">whatsapp</a></span>'
          : '<button class="chip warn" data-act="party" data-id="' + c.pid + '" style="flex:none">add phone</button>') +
        '</div></div>';
    }
    h += '</div>';
  }

  const horizon = dueItems().filter(i => i.eff > date).slice(0, 4);
  if(t === 0 && horizon.length){
    h += '<div class="sec"><h2>On the horizon</h2><button class="btn-sm" data-act="tab" data-r="week">Week board →</button></div>';
    h += '<div class="card">' + horizon.map(dueRow).join('') + '</div>';
  }
  h += '<div class="railable">' + quietHTML() + questionsHTML() + '</div>';
  h += '</main>';
  return h;
}
/* "last opportunity" is a picked flag on the adjournment, never a line of free text */
function promiseChips(m){
  const out = [];
  for(const hr of (m.hearings || [])){
    const f = hr.outcome && hr.outcome.flags; if(!f) continue;
    if(f.lastOpp === 'us') out.push(['bad','Last opportunity against us']);
    if(f.lastOpp === 'them') out.push(['warn','Last opportunity already granted to them']);
    if(f.costs) out.push(['warn','₹' + f.costs.toLocaleString('en-IN') + ' costs imposed']);
  }
  return out.slice(-2);
}
function quietHTML(){
  const q = goingQuiet();
  if(!q.length) return '';
  return '<div class="sec"><h2>Going quiet</h2><span class="hint">' + q.length + '</span></div><div class="card">' +
    q.slice(0,4).map(({m, since}) => '<button class="row" data-act="open-matter" data-id="' + m.id + '">' +
      '<div class="title" style="font-size:15px">' + esc(m.title) + '</div>' +
      '<div class="meta">Nothing listed, nothing due' + (since ? ' — last movement ' + esc(fmtY(since)) : '') + '</div></button>').join('') +
    '</div>';
}
function questionsHTML(){
  const q = openQuestions();
  if(!q.length) return '';
  return '<div class="sec"><h2>Waiting on you</h2></div><div class="card">' +
    q.map(x => '<button class="row" data-act="open-matter" data-id="' + x.m.id + '">' +
      '<div class="title" style="font-size:15px">' + esc(x.q) + '</div>' +
      '<div class="meta">' + esc(x.m.title) + ' — ' + esc(x.why) + '</div></button>').join('') + '</div>';
}
function chipRow(arr){
  const c = arr.filter(Boolean);
  return c.length ? '<div class="chips">' + c.map(([k, t]) => '<span class="chip ' + (k || '') + '">' + esc(t) + '</span>').join('') + '</div>' : '';
}
function dueRow(i){
  const d = fromISO(i.eff);
  const late = i.eff < todayISO();
  const u = late ? 'over' : urgency(i.eff);
  const who = i.obligor === 'client' ? 'Client must act — call ahead' : i.obligor === 'them' ? 'Their obligation — watch it' : null;
  return '<button class="due' + (i.muted ? ' muted' : '') + '" data-act="open-matter" data-id="' + i.m.id + '">' +
    '<span class="when"><span class="d num">' + d.getDate() + '</span><span class="m">' + MO[d.getMonth()] + '</span></span>' +
    '<span class="what"><span class="w1">' + esc(i.label) + '</span>' +
    '<span class="w2">' + esc(i.m.caseNo || i.m.title) + (i.sub ? ' · ' + esc(i.sub) : '') +
    (who ? ' · ' + esc(who) : '') +
    (i.shut ? '<br>' + esc(fmtDot(i.due)) + ' is ' + esc(i.shut) + ' — the court reopens ' + esc(fmt(i.eff)) + ', and a filing due on a closed day may be made the next working day (s.4)' : '') +
    (i.shutNoRelief ? '<br>' + esc(fmtDot(i.due)) + ' is ' + esc(i.shutNoRelief) + ' — this is not a court filing, so s.4 gives you nothing: do it before the weekend' : '') +
    (i.cost ? '<br>' + (late ? 'missed — ' : 'miss = ') + esc(i.cost) + (late ? '; condonation may still be possible' : '') : '') +
    '</span></span>' +
    '<span class="left-days ' + u + ' num">' + esc(relWords(i.eff)) + '</span></button>';
}
function callList(){
  const out = [];
  for(const m of S.matters) for(const h of (m.hearings || [])){
    if(!h.outcome) continue;
    /* whatever was closed today — including a hearing from last week recorded late tonight */
    if((h.outcome.recordedOn || h.on) !== todayISO()) continue;
    const p = PT(m.clientId);
    out.push({name: p ? p.name : '—', phone: p && p.phone, pid: m.clientId, caseNo: m.caseNo || m.title,
      outcome: outText(h.outcome), next: h.nextOn, late: h.on !== todayISO()});
  }
  return out;
}

/* ---------- Week board ---------- */
function vWeek(){
  let h = bar('This week');
  h += '<main class="wk">';
  const due = dueItems();
  const od = overdue();
  if(od.length){
    h += '<div class="banner bad"><div style="flex:1"><div class="t">' + od.length + ' already past</div>' +
      od.slice(0,3).map(i => esc(i.label) + ' (' + esc(i.m.caseNo || i.m.title) + ', ' + esc(relWords(i.eff)) + ')').join(' · ') +
      (od.length > 3 ? ' · +' + (od.length - 3) + ' more' : '') + '. These stay in view until they are dealt with.</div></div>';
  }
  for(let n = 0; n < 7; n++){
    const date = rel(n);
    const dayName = n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : fmt(date);
    const listings = listingsOn(date);
    /* the listing row already carries "must appear" — no need to say it twice on the same day */
    const dd = due.filter(i => i.eff === date && i.type !== 'presence');
    const cx = [...new Set(listings.map(l => complexOf(l.m.court)))];
    const shut = closedWhy(date);
    h += '<section class="wday">';
    h += '<div class="sec"><h2>' + esc(dayName) + (n > 1 ? '' : ' · ' + esc(fmt(date).slice(4))) + '</h2>' +
      (cx.length > 2 ? '<span class="chip bad">' + cx.length + ' complexes</span>' :
       shut && !listings.length && !dd.length ? '<span class="hint">court shut</span>' :
       '<button class="btn-sm" data-act="goto-day" data-d="' + date + '">open →</button>') + '</div>';
    if(!listings.length && !dd.length){
      h += '<div class="card"><div class="empty">' + (shut ? 'Court closed — ' + esc(shut) + '.' : 'Clear — drafting time.') + '</div></div></section>';
      continue;
    }
    h += '<div class="card">';
    if(cx.length > 2) h += '<div class="court-h" style="color:var(--bad)"><span>' + esc(cx.join(' · ')) + ' — one morning, ' + cx.length + ' complexes</span></div>';
    let lastCourt = null;
    for(const {m, h: hr} of listings){
      if(m.court !== lastCourt){ h += '<div class="court-h"><span>' + esc(m.court || 'Court not set') + '</span>' +
        (hr.cl ? '<span class="num">item ' + esc(hr.cl.item) + '</span>' : '') + '</div>'; lastCourt = m.court; }
      h += '<button class="row" data-act="open-matter" data-id="' + m.id + '">' +
        '<div style="display:flex; justify-content:space-between; gap:8px"><span class="title" style="font-size:14.5px">' + esc(m.title) + '</span>' +
        (hr.presence ? '<span class="chip bad" style="flex:none">⚠ must appear</span>' : '') + '</div>' +
        '<div class="meta num">' + esc(m.caseNo || 'pre-filing') + ' · ' + esc(hr.purpose) + '</div></button>';
    }
    h += dd.map(dueRow).join('');
    h += '</div></section>';
  }
  const later = due.filter(i => daysUntil(i.eff) >= 7);
  if(later.length){
    h += '<div class="sec"><h2>Beyond this week</h2><span class="hint">' + later.length + '</span></div><div class="card">' +
      later.slice(0,6).map(dueRow).join('') +
      (later.length > 6 ? '<div class="pad"><p class="note" style="margin:0">' + (later.length - 6) +
        ' more further out — each one lives on its own file’s Dates page.</p></div>' : '') + '</div>';
  }
  h += '</main>';
  return h;
}

/* ---------- Matters list ---------- */
function vMatters(){
  let h = bar('Matters', {action:['+ New', 'new-matter']});
  h += '<main>';
  h += '<div class="search"><span aria-hidden="true">⌕</span>' +
    '<input id="q" type="text" placeholder="Party, case no., CNR, court, paper, tag, year…" value="' + esc(searchQ) + '" autocomplete="off">' +
    (searchQ ? '<button class="btn-sm" data-act="qclear">clear</button>' : '') + '</div>';

  const searching = !!searchQ.trim();
  const counts = {
    live: S.matters.filter(m => !m.archived).length,
    archived: S.matters.filter(m => m.archived).length,
  };
  if(searching){
    h += '<div class="banner warn" style="padding:9px 12px"><div>Searching <b>every file ever recorded</b> — live and archived, whatever tab was selected.</div></div>';
  } else {
    h += '<div class="seg">' + [['open','On my desk', counts.live],['archived','Archived', counts.archived],['all','All', S.matters.length]].map(([k, l, n]) =>
      '<button data-act="mfilter" data-f="' + k + '" class="' + (matterFilter === k ? 'on' : '') + '">' + l + ' <span class="num">' + n + '</span></button>').join('') + '</div>';
  }

  let rows = matterSearch(searchQ);
  if(!searching){
    if(matterFilter === 'open') rows = rows.filter(r => !r.m.archived);
    if(matterFilter === 'archived') rows = rows.filter(r => r.m.archived);
  }
  rows.sort((a,b) => (b.m.pinned?1:0) - (a.m.pinned?1:0));

  if(!rows.length){
    h += '<div class="card"><div class="empty"><div class="big">' + (searching ? 'No file matches “' + esc(searchQ) + '”' : 'Nothing here yet') + '</div>Searched parties, case numbers, CNR, courts, papers, diary lines, tags and outcomes.</div></div>';
  } else {
    h += '<div class="card">';
    for(const {m, why} of rows){
      const nh = nextHearing(m);
      const ap = appealLastDay(m.outcome);
      h += '<button class="row" data-act="open-matter" data-id="' + m.id + '">' +
        '<div style="display:flex; justify-content:space-between; gap:8px">' +
        '<span class="title">' + (m.pinned ? '★ ' : '') + esc(m.title) + '</span>' +
        '<span style="flex:none; display:flex; gap:4px">' +
        (m.outcome ? '<span class="chip ' + (m.outcome.result === 'won' ? 'good' : m.outcome.result === 'lost' ? 'bad' : '') + '">' + esc(m.outcome.result) + '</span>' : '') +
        (m.archived ? '<span class="chip">archived</span>'
          : needsMyWork(m) ? '<span class="chip accent">needs my work</span>'
          : nh ? '<span class="chip">waiting</span>' : '<span class="chip warn">quiet</span>') +
        '</span></div>' +
        '<div class="meta num">' + esc(m.caseNo || 'pre-filing') + ' · ' + esc(m.court || 'no court yet') + '</div>' +
        '<div class="meta">for ' + esc(pname(m.clientId)) + ' · against ' + esc((m.oppIds || []).map(pname).join(', ')) + '</div>' +
        (nh ? '<div class="subline"><span class="lbl">Next</span><span class="num">' + esc(fmt(nh.on)) + ' · ' + esc(nh.purpose) + '</span></div>' : '') +
        (!nh && ap ? '<div class="subline"><span class="lbl">Appeal</span><span>last day <b class="num">' + esc(fmtDot(rollForward(ap.last))) + '</b> · ' + esc(ap.forum) + '</span></div>' : '') +
        (!nh && !ap && m.limitation && !m.limitation.met ? '<div class="subline"><span class="lbl">Clock</span><span>' +
          (m.limitation.by ? esc(m.limitation.label) + ' by <b class="num">' + esc(fmtDot(rollForward(m.limitation.by))) + '</b>'
                           : '<b style="color:var(--bad)">limitation not worked out yet</b>') + '</span></div>' : '') +
        (why ? '<div class="subline"><span class="lbl">Match</span><span>' + esc(why) + '</span></div>' : '') +
        '</button>';
    }
    h += '</div>';
  }
  h += '<p class="note">A result is not a shelf: a decided matter stays on your desk until you archive it — which is why the appeal clock above is still visible.</p>';
  h += '</main>';
  return h;
}

/* ---------- Matter folder ---------- */

  for(const pr of (m.protections || [])) if(!pr.ended){

  h += '<div style="display:flex; gap:8px; margin-bottom:4px; flex-wrap:wrap">' +

/* Purely derived: every line here is read off a record, so nothing can appear twice
   (the day you recorded something is not itself an event in the case). */
function tabStory(m){
  const ev = [];
  for(const hh of (m.hearings || [])){
    if(hh.outcome) ev.push({on: hh.on, t: outText(hh.outcome)});
    for(const mv of (hh.moves || [])) ev.push({on: mv.on, t: 'Date of ' + fmtDot(mv.from) + ' moved to ' + fmtDot(hh.on) + ' by the court — ' + mv.why});
  }
  for(const p of (m.papers || [])) ev.push({on: p.pdate, t: p.label + ' — on file' + (p.carries ? ' (' + p.carries + ')' : '')});
  for(const d of (m.directions || [])){
    ev.push({on: d.bornOn, t: 'Court: ' + d.label + ' (by ' + fmtDot(d.due) + ')'});
    if(d.done) ev.push({on: d.doneOn, t: 'Done: ' + d.label});
  }
  for(const pr of (m.protections || [])) if(pr.ended) ev.push({on: pr.endedOn, t: pr.label + ' — protection ended'});
  if(m.limitation && m.limitation.met) ev.push({on: m.limitation.metOn, t: m.limitation.label + ' — complied'});
  if(m.filedOn) ev.push({on: m.filedOn, t:'Filed — ' + (m.court || '')});
  if(m.causeOn) ev.push({on: m.causeOn, t: m.causeLabel});
  if(m.outcome) ev.push({on: m.outcome.on, t: 'Case ' + m.outcome.result + '.'});
  if(m.outcome && m.outcome.appeal && m.outcome.appeal.filedOn) ev.push({on: m.outcome.appeal.filedOn, t:'Appeal filed — ' + m.outcome.appeal.forum});
  if(m.archivedOn) ev.push({on: m.archivedOn, t:'File put away.'});
  for(const a of (m.activity || [])) ev.push({on: a.on, t: a.text});
  const seen = new Set();
  const out = ev.filter(e => e.on && e.t && !seen.has(e.on + '|' + e.t) && seen.add(e.on + '|' + e.t))
    .sort((a,b) => a.on < b.on ? 1 : -1);
  return '<div class="card">' + out.map(e =>
    '<div class="story-dot"><span class="sd num">' + esc(fmtDot(e.on)) + '</span><span>' + esc(e.t) + '</span></div>').join('') + '</div>' +
    '<p class="note">Stitched from the records above — nothing here was written separately, and nothing appears twice for having been typed on a different day.</p>';
}

  if(!closeQ) closeQ = {idx:0, done:0, form:{}, skipped:[]};
  if(closeQ.idx >= q.length) closeQ = {idx:0, done: closeQ.done, form:{}, skipped};
  if(!q.length){
    let h = bar('Close the day', {back:true});
    const left = skipped.length;
    h += '<main><div class="card"><div class="pad" style="text-align:center; padding:34px 16px">' +
      '<div style="font-size:34px; color:var(--good)">✓</div>' +

        (F.dirDue && closedWhy(F.dirDue) ? '<div class="clash bad" style="margin-top:6px">' + esc(fmt(F.dirDue)) + ' is ' + esc(closedWhy(F.dirDue)) + ' — the working date is ' + esc(fmt(rollForward(F.dirDue))) + '.</div>' : '') +

/* Two matters in the same complex on one day is how a working lawyer plans a morning.
   The thing worth a warning is two complexes at once — and a day already carrying a heavy matter. */
function clashHTML(dateISO, mid, myCourt){
  if(!dateISO || fromISO(dateISO).getFullYear() < 2000) return '';
  const shut = closedWhy(dateISO);
  if(shut) return '<div class="clash bad">⚠ ' + esc(fmt(dateISO)) + ' is ' + esc(shut) + ' — the court will not sit. Ask for another date.</div>';
  const {list, complexes, heavy} = dayLoad(dateISO, mid, myCourt);
  if(!list.length) return '<div class="clash ok">✓ ' + esc(fmt(dateISO)) + ' is clear across your matters.</div>';
  const mine = complexOf(myCourt);
  const others = [...new Set(list.map(c => complexOf(c.m.court)))];
  const away = others.filter(c => c !== mine);
  const names = list.map(c => esc(c.m.caseNo || c.m.title) + ' (' + esc(complexOf(c.m.court)) + ')').join(', ');
  if(away.length){
    return '<div class="clash bad">⚠ ' + esc(fmt(dateISO)) + ' already has ' + names + '. That is <b>' + esc(mine) + '</b> and <b>' +
      esc(away.join(', ')) + '</b> the same morning — ask for another date while you still can.</div>';
  }
  return '<div class="clash warn-soft">' + esc(fmt(dateISO)) + ' already has ' + names + ' — same complex as this one, so it is workable' +
    (heavy.length ? ', but ' + esc(heavy[0].m.caseNo || heavy[0].m.title) + ' is listed for ' + esc(heavy[0].h.purpose.toLowerCase()) + ' and will eat the morning' : '') + '.</div>';
}
function saveClose(){
  const skipped = closeQ.skipped || [];
  const q = allUnclosed().filter(x => !skipped.includes(x.h.id));
  const {m, h: hr} = q[closeQ.idx];
  const F = closeQ.form;
  const flags = {};
  if(F.lastOpp) flags.lastOpp = F.lastOpp;
  if(F.costsOn && F.costs) flags.costs = parseInt(String(F.costs).replace(/\D/g,''), 10) || 0;
  hr.outcome = {code: F.out, label: OUT_LABEL[F.out] || F.out, detail: (F.detail || '').trim() || null,
    recordedOn: todayISO()};
  if(Object.keys(flags).length) hr.outcome.flags = flags;
  if(F.nextOn){
    hr.nextOn = F.nextOn; hr.nextPurpose = F.purpose || 'Further proceedings';
    placeListing(m, F.nextOn, F.purpose,
      F.presence === 'client' ? pname(m.clientId).split('(')[0].trim() : F.presence === 'witness' ? (F.witness || '').trim() : null,
      F.presence || null);
  }
  if(F.dirOpen && F.dirKind && F.dirDue){
    m.directions.push({id: uid('dir'), kind: F.dirKind, obligor: F.dirWho || 'us', due: F.dirDue,
      bornOn: hr.on, done:false, label: F.dirKind + (F.dirWho === 'them' ? ' — their obligation' : F.dirWho === 'client' ? ' — client’s undertaking' : '') + ' (recorded at hearing)'});
  }
  /* a stay that rode on today's date does not silently ride on to the next one */
  if(F.prot){
    for(const pr of (m.protections || [])) if(!pr.ended && pr.mode === 'till-next-date'){
      if(F.prot === 'ended'){ pr.ended = true; pr.endedOn = hr.on; }
      if(F.prot === 'unpressed') pr.note = 'not pressed in court on ' + fmtDot(hr.on);
      if(F.prot === 'extended') pr.note = null;
    }
  }
  closeQ.done = (closeQ.done || 0) + 1;
  closeQ.form = {};
  save();
  toast(F.prot === 'ended' ? 'Recorded — protection marked gone' : 'Recorded — ' + (m.caseNo || m.title));
}

/* ---------- New matter + conflict check ---------- */
function vNew(){
  if(!newMatter) newMatter = {client:'', opp:'', kind:'', court:'', causeOn:''};
  const N = newMatter;
  const hits = [];
  for(const side of [['client', N.client], ['opposing party', N.opp]]){
    if(!side[1] || side[1].trim().length < 3) continue;
    for(const mt of partyMatches(side[1])){
      const asC = S.matters.filter(m => m.clientId === mt.p.id).length;
      const asO = S.matters.filter(m => (m.oppIds || []).includes(mt.p.id)).length;
      if(asC + asO) hits.push(Object.assign({asC, asO, typedAs: side[0]}, mt));
    }
  }
  const seen = new Set();
  const uniq = hits.filter(c => seen.has(c.p.id) ? false : seen.add(c.p.id));
  const strong = uniq.filter(c => c.strength === 'same');
  const weak = uniq.filter(c => c.strength === 'surname');

  let h = bar('New matter', {back:true});
  h += '<main>';
  h += '<div class="field"><label>Client</label><input type="text" id="n-client" placeholder="Who walked in" value="' + esc(N.client) + '" autocomplete="off"></div>';
  h += '<div class="field"><label>Opposing party</label><input type="text" id="n-opp" placeholder="Who is on the other side" value="' + esc(N.opp) + '" autocomplete="off"></div>';
  if(strong.length){
    h += '<div class="banner bad"><div style="flex:1"><div class="t">Already in your files</div>' +
      strong.map(c => '<div style="margin-top:4px"><button class="plink" data-act="party" data-id="' + c.p.id + '">' + esc(c.p.name) + '</button> — ' +
        [c.asC ? c.asC + ' as client' : null, c.asO ? c.asO + ' as opposing party' : null].filter(Boolean).join(', ') +
        '. Read how each ended before you accept.</div>').join('') + '</div></div>';
  }
  if(weak.length){
    h += '<div class="banner warn"><div style="flex:1"><div class="t">Same surname — probably not the same person</div>' +
      weak.map(c => '<button class="plink" data-act="party" data-id="' + c.p.id + '">' + esc(c.p.name) + '</button>').join(', ') +
      '. Shown quietly on purpose: a conflict check that shouts at every Sharma is one nobody reads.</div></div>';
  }
  h += '<div class="field"><label>Kind of matter</label><input type="text" id="n-kind" placeholder="e.g. Cheque bounce (s.138)" value="' + esc(N.kind) + '"></div>';
  h += '<div class="field"><label>Court (leave blank if pre-filing)</label><input type="text" id="n-court" placeholder="e.g. Saket (Civil Judge)" value="' + esc(N.court) + '"></div>';
  h += '<div class="field"><label>When did the cause arise?</label><input type="date" id="n-cause" value="' + esc(N.causeOn) + '" max="' + todayISO() + '">' +
    '<p class="note" style="margin:6px 2px 0">The one date a pre-filing file cannot do without. You will set the limitation period yourself on the next screen — the app counts, it does not guess.</p></div>';
  h += '<button class="btn" data-act="n-save" ' + (N.client.trim() && N.opp.trim() ? '' : 'disabled') + '>Open the file</button>';
  h += '<p class="note">The conflict answer comes from party records already in your files — one step, both directions.</p>';
  h += '</main>';
  return h;
}
function saveNew(){
  const N = newMatter;

    if(ex) return ex.id;

    /* no invented period — an honest "not worked out yet" the file will keep asking about */
    limitation: N.causeOn ? {preset:'tbd', label:'Limitation not worked out yet', by:null,
      basis:'decide the period before this file goes cold', met:false} : null,

/* ---------- Bundle builder ---------- */
function vBundle(){
  const m = M(route.id); if(!m){ route = {name:'matters'}; return vMatters(); }
  if(!bundleSel) bundleSel = {order: [], done:false};
  const B = bundleSel;
  let h = bar('Filing bundle', {back:true});
  h += '<main>';
  if(!B.done){
    h += '<p class="note" style="margin-top:0">Tick papers in the order they should appear. The index and page numbers are built from each paper’s recorded kind and date.</p>';
    h += '<div class="card">';
    for(const p of (m.papers || [])){
      const pos = B.order.indexOf(p.id);
      h += '<button class="row" data-act="b-tog" data-pid="' + p.id + '"><div style="display:flex; gap:10px; align-items:center">' +
        '<span class="chip ' + (pos >= 0 ? 'accent' : '') + '" style="flex:none; min-width:26px; text-align:center">' + (pos >= 0 ? (pos + 1) : '+') + '</span>' +
        '<span><b>' + esc(p.label) + '</b><div class="meta num">' + esc(p.pkind) + ' · dt. ' + esc(fmtDot(p.pdate)) + ' · ' + p.pages + ' pp</div></span>' +
        '</div></button>';
    }
    h += '</div>';
    h += '<button class="btn" data-act="b-make" ' + (B.order.length ? '' : 'disabled') + '>Generate bundle & index (' + B.order.length + ')</button>';
  } else {
    let pg = 1; const rows = B.order.map((pid, i) => {
      const p = (m.papers || []).find(x => x.id === pid);
      const from = pg, to = pg + p.pages - 1; pg = to + 1;
      return {i: i + 1, p, from, to};
    });
    /* annexure series follows the side we act for, and a label that already carries its own
       number is left alone rather than renumbered by position */
    const series = (m.weAre === 'respondent') ? 'R-' : 'P-';
    let ann = 0;
    for(const r of rows){
      const already = /annexure\s+[a-z]{1,2}-?\d+/i.test(r.p.label);
      const isPleading = r.p.pkind === 'Pleading' || r.p.pkind === 'Filing bundle';
      r.prefix = (!already && !isPleading && (r.p.pkind === 'Annexure' || r.p.side === 'client' || r.p.side === 'theirs' || r.p.pkind === 'Evidence'))
        ? 'Annexure ' + series + (++ann) + ': ' : '';
    }
    h += '<div class="index-doc"><h4>IN THE COURT OF ' + esc((m.court || 'THE LEARNED COURT').toUpperCase()) + '</h4>' +
      '<div class="cap num">' + esc(m.caseNo || m.title) + ' · ' + esc(pname(m.clientId)) + ' vs ' + esc((m.oppIds || []).map(pname).join(', ')) + '</div>' +
      '<h4 style="margin-bottom:8px">INDEX</h4>' +
      '<table><tr><th>S.No</th><th>Particulars</th><th>Date</th><th>Pages</th></tr>' +
      rows.map(r => '<tr><td class="num">' + r.i + '</td><td>' + esc(r.prefix) + esc(r.p.label) + '</td><td class="num">' + esc(fmtDot(r.p.pdate)) + '</td><td class="num">' + r.from + '–' + r.to + '</td></tr>').join('') +
      '</table><div class="cap" style="margin-top:10px">Total ' + (pg - 1) + ' pages, continuously numbered.</div></div>';
    h += '<p class="note">Swap one annexure and regenerate — the index and page numbers rebuild in seconds. The bundle stays on the matter as the record of what was filed. Annexures run in the <b>' + esc(series) + '</b> series because you act for the ' + esc(m.weAre || 'petitioner') + '.</p>';
    h += '<p class="note">Not yet handled, and worth deciding before this is built: the court-fee column, memo of parties, vakalatnama and statement of truth that Delhi e-filing expects — and whether the real bundle is a bookmarked, OCR’d PDF the registry will accept.</p>';
    h += '<button class="btn" data-act="b-save">Keep on the matter</button>';
    h += '<button class="btn ghost" style="margin-top:8px" data-act="b-redo">Change the order</button>';
  }
  h += '</main>';
  return h;
}

      '<h3>A diary that keeps itself</h3>' +

      '<li style="margin-bottom:5px"><b>Close the day.</b> Record this morning’s hearings the way you would at 7pm, and offer a next date that is already busy.</li>' +
      '<li style="margin-bottom:5px"><b>Tomorrow’s board.</b> Then see what the entries you just made did to it.</li>' +

      '</ul>' +
      '<div class="divider"></div>' +
      '<p style="font-size:14px; margin-bottom:10px"><b>Please tell us where it is wrong.</b> Vocabulary that does not match your courts, a step that is not how it really happens, something missing that you would need on a Tuesday morning — that is exactly what we are looking for.</p>' +

  return '';

/* ============================== events ============================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  const stopEl = e.target.closest('[data-stop]');
  if(act === 'sheet-x' && stopEl) return;

  switch(act){
    case 'tab': { const r = el.dataset.r; go(r === 'day' ? {name:'day', date: todayISO()} : {name:r}); break; }
    case 'back': history.length > 1 ? history.back() : go({name:'day', date: todayISO()}); return;
    case 'about': sheet = {kind:'about'}; paintSheet(); break;
    case 'feedback': sheet = {kind:'feedback', from: route.name, f:{}}; paintSheet(); break;
    case 'fb-send': { const f = sheet.f;
      const note = (f.note || '').trim(); if(!note) break;
      const where = SCREEN_NAME[sheet.from] || 'the app';
      const txt = 'LegalPen demo — feedback\n\n' + note + '\n\n(on ' + where + (f.who ? '; from ' + f.who.trim() : '') + ')';
      if(FEEDBACK_WA){
        window.open('https://wa.me/' + FEEDBACK_WA + '?text=' + encodeURIComponent(txt), '_blank', 'noopener');
        sheet = null; paintSheet(); toast('Thank you — WhatsApp will open with it ready to send');
      } else if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(() => { sheet = null; paintSheet();
          toast('Copied — paste it to us on WhatsApp'); }, () => toast(txt));
      } else { toast(txt); }
      break; }
    case 'reset': try{ localStorage.removeItem('legalpen-proto'); }catch(err){} S = seed(); S.seedDay = todayISO(); S.aboutSeen = true; save(); sheet = null; closeQ = null; paintSheet(); toast('Demo data reset'); go({name:'day', date: todayISO()}); break;
    case 'date': go({name:'day', date: el.dataset.d}); break;
    case 'goto-day': go({name:'day', date: el.dataset.d}); break;
    case 'open-matter': hist(); go({name:'matter', id: el.dataset.id}); break;
    case 'party': hist(); go({name:'party', id: el.dataset.id}); break;
    case 'mtab': matterTab[route.id] = el.dataset.t; render(); break;
    case 'mfilter': matterFilter = el.dataset.f; render(); break;
    case 'qclear': searchQ = ''; render(); break;
    case 'paperf': { const m = M(route.id); m._paperF = el.dataset.f; render(); break; }
    case 'paperk': { const m = M(route.id); m._paperK = el.dataset.k; render(); break; }
    case 'pin': { const m = M(route.id); m.pinned = !m.pinned; save(); render(); toast(m.pinned ? 'Pinned to top' : 'Unpinned'); break; }
    case 'archive': { const m = M(route.id);
      /* putting a file away takes everything it still owes off every board — say so plainly */
      const live = dueItems([m]);
      if(live.length && !confirm(live.length + ' date' + (live.length>1?'s':'') + ' on this file ' + (live.length>1?'are':'is') +
        ' still unmet:\n\n' + live.map(i => '· ' + i.label + ' — ' + fmtFull(i.eff)).join('\n') +
        '\n\nPutting the file away takes them off every board. Do it anyway?')) break;
      m.archived = true; m.archivedOn = todayISO(); save(); render(); toast('Filed away — still searchable for ever'); break; }
    case 'unarchive': { const m = M(route.id); m.archived = false; m.archivedOn = null; save(); render(); toast('Back on the desk'); break; }
    case 'pr-end': { const m = M(route.id); const pr = (m.protections || []).find(x => x.id === el.dataset.pid);
      if(pr){ pr.ended = true; pr.endedOn = todayISO(); save(); render(); toast('Protection recorded as ended'); } break; }
    case 'close-day': hist(); closeQ = {idx:0, done:0, form:{}, skipped:[]}; go({name:'close'}); break;
    case 'close-unskip': closeQ = {idx:0, done: closeQ.done, form:{}, skipped:[]}; render(); break;
    case 'f-out': closeQ.form.out = el.dataset.v; render(); break;
    case 'f-pur': closeQ.form.purpose = el.dataset.v; render(); break;

    case 'f-lastopp': closeQ.form.lastOpp = closeQ.form.lastOpp === el.dataset.v ? null : el.dataset.v; render(); break;

      closeQ.form = {}; render(); toast('Left open — it stays flagged until you know'); break; }

    case 'tick-dir': { const m = M(el.dataset.mid); const d = (m.directions || []).find(x => x.id === el.dataset.did);

    case 'edit-cover': { const m = M(route.id);

    case 'cv-we': sheet.f.weAre = el.dataset.v; paintSheet(); break;

    case 'cl-open': { const m = M(el.dataset.mid); const hr = (m.hearings || []).find(x => x.id === el.dataset.hid);
